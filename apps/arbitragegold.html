/* =========================================================
   13b) DATOS EN VIVO — divisas, streaming y piloto automático
   Tres fuentes públicas, ninguna necesita clave ni cuenta:
     · open.er-api.com          → tasas de cambio (USD → PEN/EUR/MXN/COP/ARS)
     · wss://stream.binance.com → bookTicker: mejor bid/ask, empujado en tiempo real
     · wss://ws.kraken.com      → ticker: mejor bid/ask, empujado en tiempo real
   Restricción dura: CERO red en file://. Si algo falla, degradación silenciosa al
   motor determinista — nunca un error en consola, nunca un alert.
   ========================================================= */
let LIVE_STREAMS = {};                        // { marketId: {bid, ask, mid, ts} }
let WS_BINANCE = null, WS_KRAKEN = null;
const WS_RETRY = { binance:0, kraken:0 };
const WS_RECONNECT_T = { binance:null, kraken:null };
let LIVE_DIRTY = false;                       // hay ticks sin pintar

function netAllowed(){
  return /^https?:$/.test(location.protocol) && location.origin !== "null";
}
/* Manda SIEMPRE el ajuste del dueño. CONFIG.LIVE_PRICES solo siembra su valor inicial:
   si fuese un override, apagar el interruptor no cortaría las conexiones salientes y el
   aviso legal (que promete no contactar con terceros) sería falso. */
function liveWanted(){
  return !!(STATE.settings && STATE.settings.liveData) && netAllowed();
}
function liveMarketCount(){
  const now = Date.now();
  return Object.keys(LIVE_STREAMS).filter(k=>(now-LIVE_STREAMS[k].ts)<60000).length;
}

/* ---------- Divisas ---------- */
async function fetchFxRates(){
  if(!liveWanted()) return false;
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 5000);
  try{
    const res = await fetch("https://open.er-api.com/v6/latest/USD", { signal:ctrl.signal });
    clearTimeout(to);
    if(!res.ok) return false;
    const data = await res.json();
    if(!data || !data.rates) return false;
    let n = 0;
    Object.keys(CURRENCIES).forEach(code=>{
      const rate = parseFloat(data.rates[code]);
      if(isFinite(rate) && rate>0){ CURRENCIES[code].rate = rate; n++; }
    });
    if(n>0){ FX_LIVE = true; return true; }
    return false;
  }catch(e){
    clearTimeout(to);
    return false;
  }
}

/* ---------- Streaming en tiempo real ---------- */
function applyTick(marketId, bid, ask){
  if(!isFinite(bid) || !isFinite(ask) || bid<=0 || ask<=0 || bid>ask) return;
  // Cordura frente al precio de referencia del activo: un tick corrupto o un feed falso
  // con BTC a 0,00000001 generaría un spread de +Infinity% y una "oportunidad" de nivel Alta.
  const ref = (MARKETS.find(m=>m.id===marketId)||{}).base;
  if(!isFiniteNum(ref) || bid < ref*0.2 || ask > ref*5) return;
  if((ask-bid)/bid > 0.05) return;   // horquilla del 5%: no es un mercado real
  const prev = LIVE_STREAMS[marketId];
  LIVE_STREAMS[marketId] = { bid:bid, ask:ask, mid:(bid+ask)/2,
                             prevMid: prev ? prev.mid : null, ts:Date.now() };
  LIVE_DIRTY = true;
}
function connectBinanceStream(){
  if(!liveWanted() || typeof WebSocket === "undefined" || WS_BINANCE) return;
  const streams = MARKETS.filter(m=>m.stream).map(m=>m.stream+"@bookTicker").join("/");
  if(!streams) return;
  try{
    const ws = new WebSocket("wss://stream.binance.com:9443/stream?streams="+streams);
    WS_BINANCE = ws;
    ws.onopen = function(){ WS_RETRY.binance = 0; };
    ws.onmessage = function(ev){
      try{
        const msg = JSON.parse(ev.data);
        const d = msg && msg.data;
        if(!d || !d.s) return;
        const sym = String(d.s).toLowerCase();
        const mkt = MARKETS.find(m=>m.stream===sym);
        if(mkt) applyTick(mkt.id, parseFloat(d.b), parseFloat(d.a));
      }catch(e){}
    };
    ws.onclose = function(){ WS_BINANCE = null; scheduleReconnect("binance"); };
    ws.onerror = function(){ try{ ws.close(); }catch(e){} };
  }catch(e){ WS_BINANCE = null; }
}
function connectKrakenStream(){
  if(!liveWanted() || typeof WebSocket === "undefined" || WS_KRAKEN) return;
  const pairs = MARKETS.filter(m=>m.wsPair).map(m=>m.wsPair);
  if(!pairs.length) return;
  try{
    const ws = new WebSocket("wss://ws.kraken.com");
    WS_KRAKEN = ws;
    ws.onopen = function(){
      WS_RETRY.kraken = 0;
      try{ ws.send(JSON.stringify({ event:"subscribe", pair:pairs, subscription:{ name:"ticker" } })); }catch(e){}
    };
    ws.onmessage = function(ev){
      try{
        const msg = JSON.parse(ev.data);
        // Formato de ticker: [channelID, {b:[bid,..], a:[ask,..], ...}, "ticker", "XBT/USD"]
        if(!Array.isArray(msg) || msg.length < 4) return;
        const payload = msg[1], pair = msg[3];
        if(!payload || !payload.b || !payload.a) return;
        const mkt = MARKETS.find(m=>m.wsPair===pair);
        if(mkt) applyTick(mkt.id, parseFloat(payload.b[0]), parseFloat(payload.a[0]));
      }catch(e){}
    };
    ws.onclose = function(){ WS_KRAKEN = null; scheduleReconnect("kraken"); };
    ws.onerror = function(){ try{ ws.close(); }catch(e){} };
  }catch(e){ WS_KRAKEN = null; }
}
function scheduleReconnect(which){
  if(!liveWanted()) return;
  WS_RETRY[which] = (WS_RETRY[which]||0)+1;
  // Nos rendimos tras 8 intentos: si la plaza no responde, reintentar cada 30 s para
  // siempre solo gasta batería y datos. La app sigue con el motor determinista.
  if(WS_RETRY[which] > 8){ updateDataModeBadge(false); return; }
  const wait = Math.min(30000, 1000*Math.pow(2, Math.min(WS_RETRY[which],5)));
  WS_RECONNECT_T[which] = setTimeout(function(){
    WS_RECONNECT_T[which] = null;
    if(!liveWanted()) return;
    if(which==="binance") connectBinanceStream();
    if(which==="kraken")  connectKrakenStream();
  }, wait);
}
function openStreams(){
  if(!liveWanted()) return;
  connectBinanceStream();
  connectKrakenStream();
}
function closeStreams(){
  // Cancelar los temporizadores en vuelo: si no, uno pendiente reabre los sockets
  // justo después de haberlos cerrado.
  ["binance","kraken"].forEach(function(k){
    if(WS_RECONNECT_T[k]){ clearTimeout(WS_RECONNECT_T[k]); WS_RECONNECT_T[k] = null; }
    WS_RETRY[k] = 0;
  });
  try{ if(WS_BINANCE){ WS_BINANCE.onclose = null; WS_BINANCE.close(); } }catch(e){}
  try{ if(WS_KRAKEN){  WS_KRAKEN.onclose  = null; WS_KRAKEN.close();  } }catch(e){}
  WS_BINANCE = null; WS_KRAKEN = null;
  LIVE_STREAMS = {};
  LIVE_DIRTY = false;
}

/* Respaldo REST: si el WebSocket no llega (proxy, firewall, navegador antiguo), al menos
   tenemos precio. No sustituye al stream, lo complementa. */
async function fetchLivePrices(){
  if(!liveWanted()) return false;
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 6000);
  try{
    const syms = MARKETS.filter(m=>m.stream).map(m=>m.stream.toUpperCase());
    const url = "https://api.binance.com/api/v3/ticker/bookTicker?symbols="+encodeURIComponent(JSON.stringify(syms));
    const res = await fetch(url, { signal:ctrl.signal });
    clearTimeout(to);
    if(res.ok){
      const data = await res.json();
      if(Array.isArray(data)){
        data.forEach(function(t){
          const mkt = MARKETS.find(m=>m.stream && m.stream.toUpperCase()===t.symbol);
          if(mkt) applyTick(mkt.id, parseFloat(t.bidPrice), parseFloat(t.askPrice));
        });
      }
    }
    // Ancla del oro para el motor determinista de los mercados sin stream.
    const gold = LIVE_STREAMS["PAXG-BINANCE"] || LIVE_STREAMS["XAUT-BINANCE"];
    if(gold && isFinite(gold.mid) && gold.mid>0) LIVE_BASE_GOLD_USD = r2(gold.mid);
    return liveMarketCount()>0;
  }catch(e){
    clearTimeout(to);
    return false;
  }
}

/* ---------- Motor de decisión (el "detector") ----------
   No es una red neuronal: es un sistema de reglas cuantitativas, que es exactamente lo
   que usan los bots de arbitraje reales. Puntúa cada ruta con cuatro señales y solo deja
   pasar las que superan todas. Llamarlo "IA" sería vendértelo más caro de lo que es. */
function scoreRoute(r){
  // 1) Margen: cuánto sobra por encima del umbral configurado.
  const margin = r.net - autoCfg().minNet;
  // 2) Estabilidad: cuánto ha aguantado el spread en las últimas muestras.
  const hist = (STATE.spreadHistory||[]).slice(0,12);
  const seen = hist.map(h=>(h.nets||{})[r.id]).filter(v=>typeof v==="number");
  const stable = seen.length ? seen.filter(v=>v>0).length/seen.length : 0.5;
  // 3) Frescura: datos en vivo valen más que simulados.
  const fresh = r.live ? 1 : 0.55;
  // 4) Coste relativo: rutas donde la comisión se come el spread puntúan peor.
  const costRatio = r.gross>0 ? clamp(1-(r.feePct/r.gross),0,1) : 0;
  const score = clamp(Math.round((clamp(margin/1.5,0,1)*40) + (stable*25) + (fresh*15) + (costRatio*20)), 0, 100);
  const level = score>=70 ? TEXTS.ALERT_LEVEL_HIGH : (score>=45 ? TEXTS.ALERT_LEVEL_MED : TEXTS.ALERT_LEVEL_LOW);
  return { score:score, level:level, stable:stable, fresh:fresh, costRatio:costRatio };
}
function pushSpreadHistory(routes){
  const nets = {};
  routes.forEach(r=>{ nets[r.id] = r.net; });
  STATE.spreadHistory.unshift({ ts:Date.now(), nets:nets, best:routes.length?routes[0].net:0 });
  if(STATE.spreadHistory.length > 120) STATE.spreadHistory.length = 120;
}

/* ---------- Piloto automático ----------
   Ejecuta SIEMPRE contra el saldo simulado. Ver AUTO_REAL_NOTE en la guía: mover dinero
   de verdad exige un servidor que custodie las claves de API, no un archivo HTML. */
function autoCfg(){
  const s = (STATE.settings && STATE.settings.auto) || {};
  return {
    on:        s.on === true,
    minNet:    isFiniteNum(s.minNet)    ? s.minNet    : CONFIG.AUTO_MIN_NET_PCT,
    ticket:    isFiniteNum(s.ticket)    ? s.ticket    : CONFIG.AUTO_MAX_TICKET,
    maxOpen:   isFiniteNum(s.maxOpen)   ? s.maxOpen   : CONFIG.AUTO_MAX_OPEN,
    dailyStop: isFiniteNum(s.dailyStop) ? s.dailyStop : CONFIG.AUTO_DAILY_STOP
  };
}
function saveAutoCfg(patch){
  STATE.settings.auto = Object.assign({}, autoCfg(), patch);
  STATE.settings.updatedAt = new Date().toISOString();
  persist();
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function autoTradesToday(){
  const day = todayKey();
  return STATE.trades.filter(t=>t.auto && String(t.ts).slice(0,10)===day);
}
function autoPnlToday(){
  const sum = autoTradesToday().reduce((a,t)=>a+(isFiniteNum(t.pnl)?t.pnl:0), 0);
  return isFiniteNum(sum) ? r2(sum) : NaN;   // NaN = estado corrupto, lo trata autoTick
}
function setAutoOn(on, reason){
  saveAutoCfg({ on:!!on });
  if(!on && reason){
    STATE.autoLog.unshift({ ts:new Date().toISOString(), kind:"stop", text:reason });
    if(STATE.autoLog.length>50) STATE.autoLog.length = 50;
    persist();
  }
  if(on){
    STATE.autoLog.unshift({ ts:new Date().toISOString(), kind:"start", text:TEXTS.AUTO_LOG_STARTED });
    if(STATE.autoLog.length>50) STATE.autoLog.length = 50;
    persist();
  }
}
/* Un ciclo del piloto: mira el mercado, aplica los cortafuegos y, como mucho, ejecuta
   una operación. Nunca encadena varias en el mismo ciclo. */
function autoTick(){
  const cfg = autoCfg();
  if(!cfg.on) return;
  const pnlToday = autoPnlToday();
  // Cortafuegos 0 — si el resultado del día no es un número, el estado está corrupto y
  // ningún límite es fiable: se apaga en vez de seguir operando a ciegas.
  if(!isFiniteNum(pnlToday)){
    setAutoOn(false, TEXTS.AUTO_STOP_CORRUPT);
    if(location.hash==="#/auto") route();
    return;
  }
  // Cortafuegos 1 — pérdida diaria acumulada.
  if(pnlToday <= -Math.abs(cfg.dailyStop)){
    setAutoOn(false, TEXTS.AUTO_STOP_DAILY);
    if(location.hash==="#/auto") route();
    return;
  }

  // Cortafuegos 2 — operaciones ya hechas hoy. Va ANTES del enfriamiento: si no, el
  // apagado se retrasa un ciclo entero y el panel sigue diciendo "activo" sin serlo.
  if(autoTradesToday().length >= cfg.maxOpen){
    setAutoOn(false, TEXTS.AUTO_STOP_MAXOPEN);
    if(location.hash==="#/auto") route();
    return;
  }
  // Cortafuegos 3 — enfriamiento global: sin él, tres rutas rentables disparan tres
  // operaciones en tres segundos seguidos.
  if(Date.now() - (STATE.autoLastGlobalAt||0) < CONFIG.AUTO_COOLDOWN_MS) return;
  const routes = currentRoutes();
  const now = Date.now();
  const anyLive = liveMarketCount() > 0;
  for(let i=0;i<routes.length;i++){
    const r = routes[i];
    if(!isFiniteNum(r.net)) continue;
    if(r.net < cfg.minNet) break;                       // vienen ordenadas: si esta no llega, ninguna
    // Nunca operar una ruta con una pata en vivo y la otra simulada: ese spread no existe,
    // es el hueco entre dos fuentes distintas, y el piloto se dedicaría a imprimir dinero.
    if(anyLive && !r.live) continue;
    if(now - (STATE.autoLastAt[r.id]||0) < CONFIG.AUTO_COOLDOWN_MS) continue;
    // Se reserva margen para comisión y deslizamiento: gastar el 100% del efectivo hace
    // que executeArb rechace siempre por saldo insuficiente y el piloto se atasque.
    const budget = Math.min(cfg.ticket, STATE.wallet.cash * 0.98);
    if(budget < r.buyPrice) continue;                    // no llega ni para una unidad
    const qty = r3(budget / r.buyPrice);
    if(qty <= 0) continue;
    const res = executeArb(r, qty, true);
    if(!res.ok){
      // Constancia SIN repetirse: antes anotaba la misma línea cada segundo y escribía en
      // localStorage indefinidamente. Se aplica el enfriamiento global también al fallo.
      const linea = r.label+" · "+res.error;
      const ultima = STATE.autoLog[0];
      if(!ultima || ultima.text !== linea){
        STATE.autoLog.unshift({ ts:new Date().toISOString(), kind:"skip", text:linea });
        if(STATE.autoLog.length>50) STATE.autoLog.length = 50;
        persist();
      }
      STATE.autoLastGlobalAt = now;
    }
    if(res.ok){
      STATE.autoLastAt[r.id] = now;
      STATE.autoLastGlobalAt = now;
      const sc = scoreRoute(r);
      STATE.autoLog.unshift({
        ts:new Date().toISOString(), kind:"trade",
        text: r.label+" · "+fmtPct(r.net)+" · "+fmtSignedUSD(res.pnl)+" · "+TEXTS.AUTO_SCORE_LABEL+" "+sc.score
      });
      if(STATE.autoLog.length>50) STATE.autoLog.length = 50;
      persist();
    }
    break;                                               // una por ciclo, y salimos
  }
}

/* =========================================================
   14) ARRANQUE
   ========================================================= */
function syncHeaderHeight(){
  const header = document.getElementById("header");
  if(!header) return;
  const h = header.offsetHeight;
  if(h) document.documentElement.style.setProperty("--header-h", h+"px");
}
function boot(){
  if(!location.hash){ location.hash = "#/"; }
  if(STATE.settings && CURRENCIES[STATE.settings.ccy]) DISPLAY_CCY = STATE.settings.ccy;
  seedHistory();
  paintChrome();
  route();
  startClock();
  syncHeaderHeight();
  window.addEventListener("hashchange", function(){ route(); syncHeaderHeight(); });
  let resizeT;
  window.addEventListener("resize", function(){ clearTimeout(resizeT); resizeT = setTimeout(syncHeaderHeight, 150); });
  // Datos en vivo: divisas, respaldo REST y streaming. Nada de esto se ejecuta en file://,
  // donde la app es 100 % simulación determinista y no toca la red.
  if(liveWanted()){
    fetchFxRates().then(function(ok){
      if(ok){ paintCurrencySelect(); refreshCurrentViewData(); }
    });
    fetchLivePrices().then(function(ok){
      if(ok){ updateDataModeBadge(true); refreshCurrentViewData(); }
    });
    openStreams();
  }
  // Al cerrar la pestaña soltamos los sockets: nada de conexiones huérfanas.
  window.addEventListener("pagehide", closeStreams);
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
