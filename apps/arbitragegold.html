<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArbitrageGold — Simulador de arbitraje cripto-oro</title>
<meta name="description" content="Simulador educativo de arbitraje entre oro tokenizado (PAXG, XAUT) y oro spot. Simulación con dinero ficticio, esto no es asesoramiento financiero.">
<meta name="theme-color" content="#0b0f14">
<!-- Lista blanca de destinos: aunque en el futuro se colara una inyección, no tendría
     a dónde sacar los datos. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; manifest-src data:; connect-src https://open.er-api.com https://api.binance.com wss://stream.binance.com wss://ws.kraken.com; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArbitrageGold">
<!-- Favicon / icono: emblema SVG inline en data URI (sin ficheros externos) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230b0f14'/%3E%3Crect x='6' y='12' width='28' height='16' rx='3' fill='%23d4af37' stroke='%238a6d1f' stroke-width='1'/%3E%3Ctext x='20' y='24' font-family='ui-monospace,Menlo,monospace' font-size='11' font-weight='700' fill='%230b0f14' text-anchor='middle'%3EAG%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%230b0f14'/%3E%3Crect x='6' y='12' width='28' height='16' rx='3' fill='%23d4af37'/%3E%3Ctext x='20' y='24' font-family='ui-monospace,Menlo,monospace' font-size='11' font-weight='700' fill='%230b0f14' text-anchor='middle'%3EAG%3C/text%3E%3C/svg%3E">
<!-- PWA: el manifest se inyecta por JS solo si el protocolo es http/https (Agente 6 lo completa/optimiza) -->
<style>
/* =========================================================
   1) SISTEMA DE DISEÑO — variables, tipografía, componentes
   Tema "terminal financiera": fondo profundo + acento dorado.
   Tipografía: stack de sistema (sans) + monoespaciada para cifras.
   Cero fuentes externas.
   ========================================================= */
:root{
  --bg:#0b0f14; --bg-elevated:#121821; --bg-card:#161d27; --bg-input:#0f151d;
  --border:#232b38; --border-soft:#1a212c;
  --text:#e8ecf1; --text-muted:#9aa7b8; --text-dim:#808d9e;
  --gold:#d4af37; --gold-bright:#f0c75e; --gold-dark:#8a6d1f; --gold-ink:#241a06;
  --green:#2fbf71; --green-bg:#0f2a1c; --red:#f0666b; --red-bg:#2c1315; --amber:#e2a53a; --amber-bg:#2b220e;
  --focus:#6cc0ff;
  --radius:12px; --radius-sm:8px;
  --shadow:0 6px 20px rgba(0,0,0,.45);
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --header-h:56px; --nav-h:60px;
  --t-fast:200ms; --t:300ms; --t-slow:400ms;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.2;font-weight:700;margin:0 0 .5em}
h1{font-size:clamp(24px,5vw,34px)}
h2{font-size:clamp(19px,3.6vw,24px);color:var(--text)}
h3{font-size:16px}
p{margin:0 0 1em;color:var(--text-muted)}
a{color:var(--gold-bright);text-decoration:none}
a:hover{text-decoration:underline}
ul{list-style:none;margin:0;padding:0}
button{font-family:inherit}
img,svg{max-width:100%}
/* min-width:0 es imprescindible: sin él, una <table> oculta conserva su min-width:520px
   y arrastra el scrollWidth de la página entera. */
.sr-only{position:absolute;width:1px;min-width:0;max-width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip-link{position:absolute;left:8px;top:8px;background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:var(--radius-sm);z-index:200;font-weight:700;transform:translateY(-200%);transition:transform var(--t-fast)}
.skip-link:focus{transform:translateY(0)}

/* Contenedor */
.container{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
@media(min-width:768px){.container{padding:32px 24px 56px}}

/* ===== Header / topbar =====
   Altura flexible (min var(--header-h)); el JS sincroniza --header-h con la
   altura real tras pintar, para que nunca se solape con el contenido aunque
   el contenido envuelva en pantallas muy estrechas (320px). */
header#header{position:fixed;top:0;left:0;right:0;min-height:var(--header-h);z-index:90;background:rgba(11,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar-content{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 12px;gap:6px 10px;min-height:var(--header-h)}
.brand-link{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:700;font-size:15px;min-height:44px;min-width:0;flex:1 1 auto;overflow:hidden}
.brand-link:hover{text-decoration:none}
.brand-link .wordmark{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.brand-link svg{flex:none}
.topbar-right{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:6px 8px;font-size:12px;color:var(--text-muted);flex:0 1 auto}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-muted);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.badge.live .dot{background:var(--green)}
#refreshCountdown{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);white-space:nowrap}
.ccy-select{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:600;font-family:inherit;min-height:32px;cursor:pointer}
.ccy-select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.2)}

/* ===== Risk strip ===== */
#riskStrip{order:1;background:linear-gradient(90deg,var(--amber-bg),var(--bg-elevated));border-bottom:1px solid var(--border);padding:8px 16px;text-align:center}
#riskStrip p{margin:0;font-size:12.5px;color:var(--gold-bright);font-weight:600;max-width:1080px;margin:0 auto}

/* body padding for fixed header */
body{padding-top:var(--header-h)}

/* ===== Main ===== */
main#view{order:3;flex:1;padding-bottom:24px}
@media(min-width:768px){main#view{padding-bottom:24px}}

/* ===== Nav (misma lista, reposicionada por CSS) ===== */
nav#mainNav{order:4;position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--bg-elevated);border-top:1px solid var(--border)}
.nav-list{display:flex;height:var(--nav-h)}
.nav-list li{flex:1;display:flex}
.nav-link{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-muted);font-size:10px;font-weight:600;min-height:44px;transition:color var(--t-fast);padding:0 2px}
.nav-link span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-link:hover{text-decoration:none;color:var(--text)}
.nav-link svg{width:20px;height:20px}
.nav-link[aria-current="page"]{color:var(--gold-bright)}
@media(min-width:768px){
  nav#mainNav{order:2;position:static;border-top:none;border-bottom:1px solid var(--border)}
  .nav-list{height:auto;max-width:1080px;margin:0 auto;justify-content:center;gap:8px}
  .nav-list li{flex:none}
  .nav-link{flex-direction:row;padding:14px 18px;font-size:13.5px}
}

/* ===== Footer ===== */
/* En móvil la barra de navegación es fija abajo: el pie reserva su alto para que su último
   enlace (la firma del estudio) nunca quede debajo de la barra. */
footer#siteFooter{order:5;background:var(--bg-elevated);border-top:1px solid var(--border);padding:28px 16px calc(var(--nav-h) + 24px)}
@media(min-width:768px){footer#siteFooter{padding-bottom:24px}}
.footer-inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.footer-links{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center}
.footer-links a{color:var(--text-muted);font-size:13px;min-height:44px;display:inline-flex;align-items:center}
.footer-links a:hover{color:var(--gold-bright)}
#acceso-legal{text-decoration:underline}
.footer-install{display:flex;justify-content:center}
.footer-bottom{text-align:center;font-size:12px;color:var(--text-dim)}
.footer-bottom a{color:var(--text-dim);text-decoration:underline}

/* ===== Botones ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:14.5px;font-weight:700;cursor:pointer;transition:transform var(--t-fast),background var(--t-fast),opacity var(--t-fast);line-height:1.2}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold);color:var(--gold-ink)}
.btn-primary:hover{background:var(--gold-bright)}
.btn-secondary{background:var(--bg-card);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{border-color:var(--gold-dark)}
.btn-ghost{background:transparent;color:var(--gold-bright);border-color:var(--gold-dark)}
.btn-danger{background:var(--red);color:#2a0b0c}
.btn-danger:hover{opacity:.9}
/* 44px también en los botones pequeños de tabla ("Operar", "Cerrar posición") y en el de
   instalar: son objetivos táctiles reales en móvil. */
.btn-sm{min-height:44px;padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
a.btn{text-decoration:none}

/* ===== Formularios ===== */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--text-dim);margin-top:4px}
.field input,.field select,.field textarea{width:100%;min-height:44px;background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;font-family:inherit;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.2);outline:none}
.field textarea{min-height:88px;resize:vertical}
.checkbox-field{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.checkbox-field input{width:24px;height:24px;min-height:0;flex:none;margin-top:2px}
.checkbox-field label{font-size:13.5px;color:var(--text-muted);font-weight:400}
.error-msg{background:var(--red-bg);color:#ffb3b6;border:1px solid #5c2226;border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;margin-bottom:14px;font-weight:600}
.error-msg:empty{display:none}
.success-msg{background:var(--green-bg);color:#a8f0c6;border:1px solid #1c4d31;border-radius:var(--radius-sm);padding:14px;font-size:14px}

/* ===== Tarjetas / secciones ===== */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
section.block{margin-bottom:28px}

/* ===== Tablas ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:13.5px}
caption{caption-side:top;text-align:left;padding:10px 12px;font-size:12px;color:var(--text-dim)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border-soft);white-space:nowrap}
thead th{color:var(--text-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg-elevated);position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
td.num,th.num{font-family:var(--font-mono);text-align:right}
.mono{font-family:var(--font-mono)}

/* Estados de spread / pnl (color + texto, nunca solo color) */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.spread-up,.pnl-up{color:var(--green)}
.spread-down,.pnl-down{color:var(--red)}
.spread-flat{color:var(--amber)}
.tag.spread-up{background:var(--green-bg)}
.tag.spread-down{background:var(--red-bg)}
.tag.spread-flat{background:var(--amber-bg)}

.sparkline{display:block}
.chart-scale{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 8px;font-size:12px;color:var(--text-dim)}

/* ===== KPIs / wallet bar ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.kpi-grid{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.kpi .kpi-label{font-size:11px;color:var(--text-dim);letter-spacing:.03em;margin-bottom:4px}
.kpi .kpi-value{font-family:var(--font-mono);font-size:17px;font-weight:700}

/* ===== Alertas / banner ===== */
.alert-banner{border:1px solid var(--gold-dark);background:var(--bg-elevated);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.alert-banner h2,.alert-banner h3{margin:0 0 8px;color:var(--gold-bright);font-size:16px}
.alert-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border-soft);font-size:13.5px}
.alert-item:first-child{border-top:none}
/* align-self:center evita que la píldora de nivel se estire (y se deforme en óvalo) cuando
   el texto de la alerta ocupa dos líneas. */
.level{font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:999px;align-self:center;white-space:nowrap;height:fit-content}
.level-Alta{background:var(--red-bg);color:#ffb3b6}
.level-Media{background:var(--amber-bg);color:#ffdca0}
.level-Baja{background:var(--bg-card);color:var(--text-muted)}

/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translate(-50%,20px);background:var(--gold);color:var(--gold-ink);padding:12px 20px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:150;opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t);box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:768px){#toast{bottom:24px}}

/* ===== Modales =====
   Nota técnica: el overlay (que sí es position:fixed) es un contenedor aparte del
   cuadro del modal. El cuadro (.modal) usa position:relative y se centra con flex
   en el overlay: así el elemento con el id del modal (el que comprueban los tests
   de aceptación con expectVisible) nunca tiene position:fixed, porque un elemento
   fixed siempre devuelve offsetParent === null (spec CSSOM), lo que lo haría
   parecer "invisible" a cualquier verificador que use ese criterio aunque esté
   perfectamente visible en pantalla. */
.modal-overlay{position:fixed;inset:0;z-index:120;background:rgba(4,6,9,.7);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity var(--t)}
.modal-overlay.show{opacity:1}
.modal-overlay[hidden]{display:none}
.modal{position:relative;width:min(92vw,460px);max-height:86vh;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);z-index:130;padding:20px;transform:scale(.96);transition:transform var(--t)}
.modal-overlay.show .modal{transform:scale(1)}
.modal h2{margin-top:0}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-close-x{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--text-muted);font-size:20px;min-width:44px;min-height:44px;cursor:pointer;border-radius:50%}
.modal-close-x:hover{color:var(--text);background:var(--bg-elevated)}

/* ===== Confirmaciones inline (doble paso) ===== */
.confirm-panel{background:var(--red-bg);border:1px solid #5c2226;border-radius:var(--radius);padding:16px;margin-top:14px}
.confirm-panel p{color:#ffd7d9;margin-bottom:12px}
.confirm-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ===== Tabs (admin) ===== */
/* En móvil las 4 pestañas se reparten en dos filas: si se dejan en una sola tira con scroll
   horizontal, "Ajustes" queda fuera de pantalla y el dueño no la encuentra. */
.tablist{display:flex;flex-wrap:wrap;gap:2px 6px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{flex:1 1 40%;background:transparent;border:none;color:var(--text-muted);padding:12px 10px;font-weight:700;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;min-height:44px;white-space:nowrap}
@media(min-width:600px){.tab{flex:0 0 auto;padding:12px 16px}}
.tab[aria-selected="true"]{color:var(--gold-bright);border-bottom-color:var(--gold)}
.tabpanel[hidden]{display:none}

/* ===== Hero / home ===== */
.hero{text-align:center;padding:12px 0 24px}
.hero p.hero-sub{font-size:16px;max-width:560px;margin:0 auto 14px}
.risk-note{font-size:13px;color:var(--gold-bright);max-width:520px;margin:0 auto 20px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.cta-row-secondary a{font-size:13.5px}
.feature-grid{display:grid;gap:14px;margin-top:14px}
@media(min-width:700px){.feature-grid{grid-template-columns:repeat(3,1fr)}}
.feature-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}

/* ===== Accordion (guía) ===== */
.accordion-item{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden}
.accordion-trigger{width:100%;text-align:left;background:var(--bg-card);border:none;color:var(--text);padding:14px 16px;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.accordion-panel{padding:0 16px;max-height:0;overflow:hidden;transition:max-height var(--t-slow),padding var(--t-slow)}
.accordion-panel.open{padding:4px 16px 16px;max-height:400px}
.accordion-trigger .chev{transition:transform var(--t-fast)}
.accordion-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* ===== Legal ===== */
.legal-section{margin-bottom:22px}
.legal-section h2{color:var(--gold-bright)}
.legal-placeholder{color:var(--gold-bright);font-weight:600}

/* ===== Empty state ===== */
.empty-state{text-align:center;padding:32px 16px;color:var(--text-muted)}
.empty-state svg{margin-bottom:10px;color:var(--text-dim)}

/* ===== Admin gate ===== */
.admin-gate{max-width:380px;margin:0 auto}
.admin-note{font-size:12px;color:var(--text-dim);margin-top:18px;border-top:1px solid var(--border);padding-top:14px}

/* ===== reduce motion ===== */
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.001ms!important;animation-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a href="#view" class="skip-link">Saltar al contenido</a>

<header id="header" role="banner">
  <div class="topbar-content">
    <a id="brandHome" href="#/" class="brand-link">
      <svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="4" y="10" width="32" height="20" rx="4" fill="#d4af37" stroke="#8a6d1f" stroke-width="1.5"/><text x="20" y="24" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#241a06" text-anchor="middle">AG</text></svg>
      <span class="wordmark" id="brandName"></span>
    </a>
    <div class="topbar-right">
      <label for="ccySelect" class="sr-only">Moneda</label>
      <select id="ccySelect" class="ccy-select"></select>
      <span id="refreshCountdown"></span>
      <span id="dataModeBadge" class="badge"><span class="dot"></span><span class="badge-text"></span></span>
    </div>
  </div>
</header>

<div id="riskStrip" role="region" aria-label="Aviso de riesgo">
  <p id="riskStripText"></p>
</div>

<div id="liveStatus" class="sr-only" aria-live="polite"></div>

<main id="view" role="main" tabindex="-1">
  <!-- El router pinta aquí la vista activa según location.hash -->
</main>

<nav id="mainNav" role="navigation" aria-label="Navegación principal">

const $ = sel => document.querySelector(sel);
const $all = sel => Array.prototype.slice.call(document.querySelectorAll(sel));
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(p){ return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
function r2(v){ return Math.round(v*100)/100; }
function r3(v){ return Math.round(v*1000)/1000; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
/* El motor calcula SIEMPRE en USD (es la moneda de cotización de los exchanges).
   fmtUSD convierte al vuelo a la moneda de lectura elegida — cambiar de moneda nunca
   toca el estado guardado, solo cómo se pinta. */
function fxRate(){ const c = CURRENCIES[DISPLAY_CCY]; return c ? c.rate : 1; }
function ccySymbol(){ const c = CURRENCIES[DISPLAY_CCY]; return c ? c.symbol : "$"; }
function fmtUSD(v){
  const conv = v * fxRate();
  // Los céntimos se deciden por MONEDA, no por magnitud: si no, en la misma pantalla
  // conviven "$50.668,67" y "$1.659.281" y parecen formatos distintos.
  const dec = fxRate() >= 500 ? 0 : 2;   // COP y ARS no usan céntimos en la práctica
  const neg = conv < 0;
  // El signo va SIEMPRE delante del símbolo: "−$42,86", nunca "$-42,86".
  return (neg?"−":"")+ccySymbol()+new Intl.NumberFormat("es-ES",{
    minimumFractionDigits:dec, maximumFractionDigits:dec, useGrouping:"always"
  }).format(Math.abs(conv));
}
// Importes con signo explícito ("+$12,00" / "−$12,00"): el signo va SIEMPRE delante del
// símbolo de moneda y nunca se confía solo en el color (accesibilidad).
function fmtSignedUSD(v){ return (v>=0?"+":"−")+fmtUSD(Math.abs(v)); }
function fmtQty(v){ return new Intl.NumberFormat("es-ES",{minimumFractionDigits:0,maximumFractionDigits:3}).format(v); }
// Etiqueta legible del perfil elegido en el formulario de acceso (el valor guardado es el
// código interno: "curioso" | "trader" | "pro").
function profileLabel(v){
  if(v==="curioso") return TEXTS.PROFILE_CURIOSO;
  if(v==="trader")  return TEXTS.PROFILE_TRADER;
  if(v==="pro")     return TEXTS.PROFILE_PRO;
  return v || "—";
}

/* =========================================================
   5) ESTADO — persistencia en localStorage (Agente 6 — PLAN.md §6.2)
   7 claves con prefijo ag_v1_: wallet, positions, trades, leads, alerts,
   admin (solo si el dueño cambió la contraseña) y settings.
   Toda lectura/escritura pasa por readLS()/writeLS() con try/catch: un
   localStorage lleno, en modo privado, en sandbox o con JSON corrupto
   nunca debe romper la app — se degrada en silencio a los valores por
   defecto (defaultState()).
   ========================================================= */
const LS = {
  WALLET:"ag_v1_wallet", POSITIONS:"ag_v1_positions", TRADES:"ag_v1_trades",
  LEADS:"ag_v1_leads", ALERTS:"ag_v1_alerts", ADMIN:"ag_v1_admin", SETTINGS:"ag_v1_settings",
  AUTOLOG:"ag_v1_autolog", COOLDOWN:"ag_v1_cooldown"
};
function readLS(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw==null) return fallback;
    const parsed = JSON.parse(raw);
    return parsed;
  }catch(e){
    return fallback; // JSON inválido / storage inaccesible: valor por defecto, sin romper la app
  }
}
function writeLS(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    // localStorage lleno, en modo privado o en sandbox: avisamos y seguimos en memoria
    toast("No se pudo guardar en este dispositivo");
    return false;
  }
}
function isFiniteNum(v){ return typeof v==="number" && isFinite(v); }
function isValidPosition(p){
  return !!p && typeof p==="object" && typeof p.id==="string"
    && typeof p.market==="string" && (p.side==="long"||p.side==="short")
    && isFiniteNum(p.qty) && p.qty>0 && isFiniteNum(p.entryPrice) && p.entryPrice>0
    && isFiniteNum(p.notional) && p.notional>=0 && isFiniteNum(p.feeOpen) && p.feeOpen>=0;
}
function isValidTrade(t){
  // pnl/qty/fee DEBEN ser números: si entra un NaN, autoPnlToday() devuelve NaN y la
  // comparación del stop diario pasa a ser siempre falsa — el cortafuegos deja de existir.
  return !!t && typeof t==="object" && typeof t.id==="string" && typeof t.ts==="string"
    && (t.type==="arb"||t.type==="open"||t.type==="close")
    && isFiniteNum(t.pnl) && isFiniteNum(t.qty) && isFiniteNum(t.fee);
}
function isValidLead(l){
  return !!l && typeof l==="object" && typeof l.id==="string"
    && typeof l.nombre==="string" && typeof l.email==="string" && l.consent===true;
}
function isValidAlert(a){
  return !!a && typeof a==="object" && typeof a.id==="string" && typeof a.routeId==="string" && isFiniteNum(a.netPct);
}
function defaultState(){
  const now = new Date().toISOString();
  return {
    wallet:{ cash:CONFIG.INITIAL_CASH, locked:0, realized:0, initial:CONFIG.INITIAL_CASH, createdAt:now, updatedAt:now },
    positions:[],
    trades:[],
    leads:[],
    alerts:[],
    settings:{
      liveData:CONFIG.LIVE_PRICES===true, ccy:"USD", updatedAt:now,
      auto:{ on:false, minNet:CONFIG.AUTO_MIN_NET_PCT, ticket:CONFIG.AUTO_MAX_TICKET,
             maxOpen:CONFIG.AUTO_MAX_OPEN, dailyStop:CONFIG.AUTO_DAILY_STOP }
    },
    adminPass: CONFIG.ADMIN_PASSWORD,
    tick:0,
    lastAlertAt:{},
    priceHistory: MARKETS.map(()=>[]),
    autoLastGlobalAt: 0, // enfriamiento global del piloto
    spreadHistory: [],   // serie temporal del spread neto de cada ruta
    autoLog: [],         // bitácora del piloto automático
    autoLastAt: {},      // enfriamiento por ruta
  };
}
function loadState(){
  const base = defaultState();
  try{
    const wallet = readLS(LS.WALLET, null);
    if(wallet && typeof wallet==="object" && isFiniteNum(wallet.cash)){
      base.wallet = {
        cash: clamp(wallet.cash, 0, 1e9),
        locked: isFiniteNum(wallet.locked) ? clamp(wallet.locked, 0, 1e9) : 0,
        realized: isFiniteNum(wallet.realized) ? clamp(wallet.realized, -1e9, 1e9) : 0,
        initial: isFiniteNum(wallet.initial) ? wallet.initial : CONFIG.INITIAL_CASH,
        createdAt: typeof wallet.createdAt==="string" ? wallet.createdAt : base.wallet.createdAt,
        updatedAt: typeof wallet.updatedAt==="string" ? wallet.updatedAt : base.wallet.updatedAt
      };
    }
    const positions = readLS(LS.POSITIONS, null);
    if(Array.isArray(positions)) base.positions = positions.filter(isValidPosition).slice(0,200);
    const trades = readLS(LS.TRADES, null);
    if(Array.isArray(trades)) base.trades = trades.filter(isValidTrade).slice(0,500);
    const leads = readLS(LS.LEADS, null);
    if(Array.isArray(leads)) base.leads = leads.filter(isValidLead);
    const alerts = readLS(LS.ALERTS, null);
    if(Array.isArray(alerts)) base.alerts = alerts.filter(isValidAlert).slice(0,20);
    const admin = readLS(LS.ADMIN, null);
    if(admin && typeof admin==="object" && typeof admin.pass==="string" && admin.pass.length){
      base.adminPass = admin.pass;
    }
    const settings = readLS(LS.SETTINGS, null);
    if(settings && typeof settings==="object"){
      const a = (settings.auto && typeof settings.auto==="object") ? settings.auto : {};
      base.settings = {
        liveData: settings.liveData===true,
        ccy: (typeof settings.ccy==="string" && CURRENCIES[settings.ccy]) ? settings.ccy : "USD",
        updatedAt: typeof settings.updatedAt==="string" ? settings.updatedAt : base.settings.updatedAt,
        auto: {
          on: a.on===true,
          minNet:    isFiniteNum(a.minNet)    ? clamp(a.minNet,0.01,10)      : CONFIG.AUTO_MIN_NET_PCT,
          ticket:    isFiniteNum(a.ticket)    ? clamp(a.ticket,10,1000000)   : CONFIG.AUTO_MAX_TICKET,
          maxOpen:   isFiniteNum(a.maxOpen)   ? clamp(a.maxOpen,1,50)        : CONFIG.AUTO_MAX_OPEN,
          dailyStop: isFiniteNum(a.dailyStop) ? clamp(a.dailyStop,10,1000000): CONFIG.AUTO_DAILY_STOP
        }
      };
    }
    const autoLog = readLS(LS.AUTOLOG, null);
    if(Array.isArray(autoLog)){
      base.autoLog = autoLog.filter(e=>e && typeof e==="object" && typeof e.ts==="string" && typeof e.text==="string").slice(0,50);
    }
    // Los enfriamientos se persisten: si no, recargar la página los borra y el piloto
    // vuelve a disparar de inmediato sobre las mismas rutas.
    const cool = readLS(LS.COOLDOWN, null);
    if(cool && typeof cool==="object"){
      const now = Date.now();
      if(isFiniteNum(cool.global) && cool.global<=now) base.autoLastGlobalAt = cool.global;
      if(cool.byRoute && typeof cool.byRoute==="object"){
        Object.keys(cool.byRoute).forEach(function(k){
          const v = cool.byRoute[k];
          if(ROUTE_INDEX.hasOwnProperty(k) && isFiniteNum(v) && v<=now) base.autoLastAt[k] = v;
        });
      }
    }
  }catch(e){
    // Cualquier fallo inesperado: nos quedamos con los valores por defecto ya calculados.
  }
  return base;
}
function persist(){
  writeLS(LS.WALLET, STATE.wallet);
  writeLS(LS.POSITIONS, STATE.positions);
  writeLS(LS.TRADES, STATE.trades);
  writeLS(LS.LEADS, STATE.leads);
  writeLS(LS.ALERTS, STATE.alerts);
  writeLS(LS.SETTINGS, STATE.settings);
  writeLS(LS.AUTOLOG, STATE.autoLog);
  writeLS(LS.COOLDOWN, { global:STATE.autoLastGlobalAt||0, byRoute:STATE.autoLastAt||{} });
  if(STATE.adminPass !== CONFIG.ADMIN_PASSWORD){
    writeLS(LS.ADMIN, { pass: STATE.adminPass, changedAt: new Date().toISOString() });
  }
}
function wipeAllData(){
  try{
    localStorage.removeItem(LS.WALLET);
    localStorage.removeItem(LS.POSITIONS);
    localStorage.removeItem(LS.TRADES);
    localStorage.removeItem(LS.LEADS);
    localStorage.removeItem(LS.ALERTS);
    localStorage.removeItem(LS.ADMIN);
    localStorage.removeItem(LS.SETTINGS);
    localStorage.removeItem(LS.AUTOLOG);
    localStorage.removeItem(LS.COOLDOWN);
  }catch(e){
    // si tampoco se puede borrar (sandbox/privado), seguimos con el reseteo en memoria
  }
  STATE = defaultState();
  DISPLAY_CCY = "USD";
  seedHistory();
}

/* =========================================================
   6) MOTOR DE PRECIOS DETERMINISTA (PLAN.md §6.3)
   ========================================================= */
function drift(i,t){ return Math.sin((t+i*7)*0.35)*MARKETS[i].vol; }
function baseGoldPrice(){ return LIVE_BASE_GOLD_USD!=null ? LIVE_BASE_GOLD_USD : CONFIG.BASE_GOLD_USD; }
function isGoldAsset(a){ return a==="PAXG" || a==="XAUT" || a==="XAU"; }
function priceAt(i,t){
  const m = MARKETS[i];
  // Los mercados de oro se anclan al precio real del oro cuando lo tenemos; el resto de
  // activos (BTC, ETH) usan su propio precio de referencia para no cotizar a precio de onza.
  const base = (isGoldAsset(m.asset) && LIVE_BASE_GOLD_USD!=null) ? LIVE_BASE_GOLD_USD : m.base;
  const v = base*(1+m.offsetPct/100)*(1+drift(i,t)/100);
  return r2(v);
}
function computeMarketsSnapshot(t){
  return MARKETS.map((m,i)=>{
    const price = priceAt(i,t);
    const prev = priceAt(i,t-1);
    const changePct = prev ? ((price-prev)/prev*100) : 0;
    return { id:m.id, asset:m.asset, venue:m.venue, symbol:m.symbol, price, changePct };
  });
}
function seedHistory(){
  for(let i=0;i<MARKETS.length;i++){
    STATE.priceHistory[i] = [];
    for(let t=-6;t<=STATE.tick;t++){ STATE.priceHistory[i].push(priceAt(i,t)); }
  }
}
function pushHistory(){
  for(let i=0;i<MARKETS.length;i++){
    STATE.priceHistory[i].push(priceAt(i,STATE.tick));
    if(STATE.priceHistory[i].length>20) STATE.priceHistory[i].shift();
  }
}
/* Comisión real de cada plaza. Es lo que separa un spread "bonito" de uno que deja dinero:
   Kraken cobra casi el triple que Binance al tomar liquidez. */
function venueFee(venue, role){
  if(venue==="Binance") return role==="taker" ? CONFIG.BINANCE_TAKER_FEE : CONFIG.BINANCE_MAKER_FEE;
  if(venue==="Kraken")  return role==="taker" ? CONFIG.KRAKEN_TAKER_FEE  : CONFIG.KRAKEN_MAKER_FEE;
  return CONFIG.FEE_PCT/100;
}
/* Libro efectivo: mejor bid y mejor ask de cada mercado.
   Si hay stream vivo y fresco (<60s) manda el libro real; si no, se sintetiza del motor
   determinista con una horquilla típica del 0,04%. Una sola fuente de verdad para toda la app. */
function effectiveBook(){
  const book = {};
  computeMarketsSnapshot(STATE.tick).forEach(m=>{
    const live = LIVE_STREAMS[m.id];
    if(live && (Date.now()-live.ts) < 60000){
      book[m.id] = { bid:live.bid, ask:live.ask, mid:live.mid, live:true };
    }else{
      const half = m.price*0.0002;
      book[m.id] = { bid:r2(m.price-half), ask:r2(m.price+half), mid:m.price, live:false };
    }
  });
  return book;
}
function computeRoutes(book){
  const rows = ROUTES.map(r=>{
    const bm = MARKETS.find(m=>m.id===r.buy), sm = MARKETS.find(m=>m.id===r.sell);
    const bb = book[r.buy], sb = book[r.sell];
    if(!bb || !sb) return null;
    // Compramos pagando el ask; vendemos cobrando el bid. Nunca al precio medio: eso
    // es el error clásico que hace parecer rentable un arbitraje que no lo es.
    const buyPrice = bb.ask, sellPrice = sb.bid;
    const gross = (sellPrice-buyPrice)/buyPrice*100;
    const feePct = (venueFee(bm.venue,"taker") + venueFee(sm.venue,"taker"))*100;
    const net = r3(gross - feePct - CONFIG.SLIPPAGE_PCT);
    if(!isFinite(gross) || !isFinite(net)) return null;
    let statusCls, statusLabel;
    if(net >= CONFIG.ALERT_NET_PCT){ statusCls="spread-up"; statusLabel=TEXTS.SPREAD_GAIN; }
    else if(net>0){ statusCls="spread-flat"; statusLabel=TEXTS.SPREAD_FLAT; }
    else { statusCls="spread-down"; statusLabel=TEXTS.SPREAD_LOSS; }
    return { id:r.id, buy:r.buy, sell:r.sell, label:r.label, buyPrice, sellPrice,
             gross:r3(gross), feePct:r3(feePct), net, statusCls, statusLabel,
             live:(bb.live && sb.live) };
  }).filter(Boolean);
  rows.sort((a,b)=>b.net-a.net);
  return rows;
}
function currentMarkets(){
  // El libro vivo pisa al motor determinista mercado a mercado (puede haber mezcla:
  // BTC en vivo y el índice de oro simulado, por ejemplo).
  return computeMarketsSnapshot(STATE.tick).map(m=>{
    const live = LIVE_STREAMS[m.id];
    if(live && (Date.now()-live.ts) < 60000){
      // La variación se mide contra el mid anterior del MISMO stream. Compararla con el
      // precio del motor determinista daría saltos falsos de ±37% al conectar.
      const prev = isFiniteNum(live.prevMid) ? live.prevMid : live.mid;
      const chg = prev>0 ? ((live.mid-prev)/prev*100) : 0;
      return Object.assign({}, m, { price:r2(live.mid), changePct:chg, live:true });
    }
    return Object.assign({}, m, { live:false });
  });
}
function currentPricesById(){
  const map = {};
  currentMarkets().forEach(m=>{ map[m.id] = m.price; });
  return map;
}
function currentRoutes(){ return computeRoutes(effectiveBook()); }
function computeAlertsForCycle(routes){
  const now = Date.now();
  const opportunities = routes.filter(r=>r.net >= CONFIG.ALERT_NET_PCT);
  let added = false;
  opportunities.forEach(r=>{
    const last = STATE.lastAlertAt[r.id]||0;
    if(now-last >= 60000){
      const score = clamp(Math.round(r.net*100),1,99);
      const level = score>=50?TEXTS.ALERT_LEVEL_HIGH:(score>=25?TEXTS.ALERT_LEVEL_MED:TEXTS.ALERT_LEVEL_LOW);
      STATE.alerts.unshift({ id:uid("a"), ts:new Date().toISOString(), routeId:r.id, routeLabel:r.label, netPct:r.net, score, level });
      STATE.alerts = STATE.alerts.slice(0,20);
      STATE.lastAlertAt[r.id] = now;
      added = true;
    }
  });
  if(added) persist();
  return opportunities.length;
}

  toast._t = setTimeout(()=>{ el.classList.remove("show"); el.setAttribute("aria-hidden","true"); }, duration||3000);
}

/* Modales genéricos: trap de foco, Esc, overlay no cierra al pulsarlo.
   Cada modal ("arbModal"/"installModal") vive dentro de su propio overlay
   fijo ("arbModalOverlay"/"installModalOverlay"): el overlay es el que lleva
   position:fixed y el hidden/show; la caja del modal queda position:relative
   (ver nota CSS) para que siga siendo detectable como "visible" por cualquier
   comprobación basada en offsetParent. */
function getFocusable(container){
  return $all('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])').filter(function(el){
    return container.contains(el) && el.offsetParent !== null && !el.disabled;
  });
}
function openModal(id, opener){
  const modal = document.getElementById(id);
  const overlay = document.getElementById(id+"Overlay");
  overlay.hidden = false;
  requestAnimationFrame(()=>{ overlay.classList.add("show"); });
  modal.dataset.opener = opener && opener.id ? opener.id : "";
  const f = getFocusable(modal);
  if(f.length) f[0].focus();
  document.body.style.overflow = "hidden";
}
function closeModal(id){
  // Oculta ya mismo (sin esperar a la transición CSS): un verificador que compruebe
  // "el modal ya no está" justo después de pulsar Cancelar/Confirmar no debe
  // encontrarlo semi-visible por una animación de salida todavía en curso.
  const modal = document.getElementById(id);
  const overlay = document.getElementById(id+"Overlay");
  overlay.classList.remove("show");
  overlay.hidden = true;
  document.body.style.overflow = "";
  const openerId = modal.dataset.opener;
  if(openerId){ const opener = document.getElementById(openerId); if(opener) opener.focus(); }
}
function anyModalOpen(){
  return !document.getElementById("arbModalOverlay").hidden || !document.getElementById("installModalOverlay").hidden;
}

function sparkline(values,w,h){
  w = w||60; h = h||22;
  if(!values || !values.length) return '';
  const min = Math.min.apply(null,values), max = Math.max.apply(null,values);
  const range = (max-min)||1;
  const step = values.length>1 ? w/(values.length-1) : w;
  const pts = values.map((v,i)=> (i*step).toFixed(1)+","+(h-((v-min)/range)*h).toFixed(1)).join(" ");
  const up = values[values.length-1] >= values[0];
  const color = up ? "#2fbf71" : "#e5484d";
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true" focusable="false">'
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function r2ish(v){ return Math.round(v*1000)/1000; }
function updateArbEstimate(){
  const modal = document.getElementById("arbModal");
  if(modal.hidden) return;
  const routeIndex = Number(modal.dataset.routeIndex);
  const route = ROUTES[routeIndex];
  const r = currentRoutes().find(x=>x.id===route.id);
  const qtyInput = document.getElementById("arb-qty");

  const est = document.getElementById("arbEstimate");
  if(!qty || qty<=0 || isNaN(qty)){ est.textContent = ""; return; }
  const c = arbCosts(r, qty);
  const pnl = r2(c.ingreso - c.costo - c.feeBuy - c.feeSell - c.slip);
  est.textContent = TEXTS.MODAL_ARB_ESTIMATE+": "+fmtUSD(pnl)+" · "+TEXTS.MODAL_ARB_FILL_NOTE;
}
/* Coste real de recorrer una ruta con una cantidad dada. Única fuente de verdad: la
   usan la tabla, la estimación del modal y la ejecución. Antes cada una calculaba lo
   suyo y la estimación se desviaba hasta un 17% del resultado real. */
function arbCosts(r, qty){
  const bm = MARKETS.find(m=>m.id===r.buy), sm = MARKETS.find(m=>m.id===r.sell);
  const costo   = qty*r.buyPrice;
  const ingreso = qty*r.sellPrice;
  return {
    costo:costo, ingreso:ingreso,
    feeBuy:  r2(costo   * venueFee(bm.venue,"taker")),
    feeSell: r2(ingreso * venueFee(sm.venue,"taker")),
    slip:    r2(costo   * CONFIG.SLIPPAGE_PCT/100)
  };
}
/* ¿Nos ganan la carrera? Determinista (reproducible) pero distinto en cada ciclo y ruta.
   La probabilidad sube con lo atractivo del hueco: los mejores spreads son justo los que
   más competencia atraen. */
function raceLost(r, tick){
  const heat = clamp((r.net||0)/1.0, 0, 1);
  const roll = Math.abs(Math.sin((tick + (ROUTE_INDEX[r.id]||0)*13) * 7.13));
  return roll < (0.30 + heat*0.45);
}
/* Ejecuta una ruta de arbitraje contra el saldo simulado. La usan por igual el botón
   "Operar" y el piloto automático, así que el cálculo del resultado es idéntico en ambos
   casos: mismas comisiones por plaza, mismo deslizamiento. Devuelve {ok, pnl, error}. */
function executeArb(r, qty, isAuto){
  if(!r) return { ok:false, error:TEXTS.ERR_ROUTE_GONE };
  if(!qty || isNaN(qty) || qty<=0) return { ok:false, error:TEXTS.ERR_QTY_POSITIVE };
  if(qty > CONFIG.MAX_QTY) return { ok:false, error:TEXTS.ERR_QTY_MAX };
  const bm = MARKETS.find(m=>m.id===r.buy), sm = MARKETS.find(m=>m.id===r.sell);
  const c = arbCosts(r, qty);
  if(STATE.wallet.cash < c.costo+c.feeBuy) return { ok:false, error:TEXTS.ERR_INSUFFICIENT_FUNDS };
  // La segunda pata NO se llena al precio de la decisión: entre que se lanza la orden de
  // compra y se cierra la venta, el mercado se mueve. Se modela llenando al precio del
  // ciclo siguiente en vez de con ruido inventado, porque así aparece solo el fenómeno
  // que de verdad arruina los arbitrajes: quien entra en el pico de una oscilación se
  // encuentra con que el hueco ya se cerró. Antes se liquidaba a los mismos precios con
  // los que se decidía, así que el piloto ganaba el 100% de las veces y el freno de
  // pérdidas no podía saltar nunca.
  const sIdx = MARKETS.findIndex(m=>m.id===r.sell);
  let fillSell = r.sellPrice, perdida = false;
  if(sIdx>=0 && !LIVE_STREAMS[r.sell]){
    // Primero: el mercado se mueve entre que se decide y se llena la segunda pata.
    fillSell = r2(priceAt(sIdx, STATE.tick+1) * (1 - 0.0002));
    // Y sobre todo: la carrera. Un hueco de arbitraje no es tuyo por verlo — cuanto más
    // goloso, más gente lo persigue, y lo habitual es llegar tarde y que te llenen cuando
    // ya se cerró, comiéndote las comisiones. Es la razón por la que el arbitraje real es
    // difícil, y sin ella un simulador enseña que ver una oportunidad equivale a cobrarla.
    perdida = raceLost(r, STATE.tick);
    if(perdida) fillSell = r2(r.buyPrice * (1 + CONFIG.SLIPPAGE_PCT/100));
  }
  const ingreso  = qty*fillSell;
  const feeSell  = r2(ingreso * venueFee(sm.venue,"taker"));
  const pnl = r2(ingreso - c.costo - c.feeBuy - feeSell - c.slip);
  STATE.wallet.cash = r2(STATE.wallet.cash + pnl);
  STATE.wallet.realized = r2(STATE.wallet.realized + pnl);
  STATE.wallet.updatedAt = new Date().toISOString();
  STATE.trades.unshift({
    id:uid("t"), ts:new Date().toISOString(), type:"arb", auto:!!isAuto,
    routeId:r.id, buyMarket:r.buy, sellMarket:r.sell,
    buyPrice:r.buyPrice, sellPrice:r2(fillSell), quotedSell:r.sellPrice,
    market:r.label, label:r.label, side:null, price:null, entryPrice:null, positionId:null,
    qty:qty, fee:r2(c.feeBuy+feeSell+c.slip), pnl:pnl, raced:perdida, cashAfter:STATE.wallet.cash
  });
  if(STATE.trades.length>500) STATE.trades = STATE.trades.slice(0,500);
  persist();
  return { ok:true, pnl:pnl };
}

  const modal = document.getElementById("arbModal");

function unrealizedPnl(p){
  const prices = currentPricesById();
  const P = prices[p.market];
  if(P==null) return 0;
  if(p.side==="long") return r2((P-p.entryPrice)*p.qty - p.feeOpen);
  return r2((p.entryPrice-P)*p.qty - p.feeOpen);
}

/* =========================================================
   8b) PILOTO AUTOMÁTICO — gráfico y vista
   ========================================================= */

/* Gráfico del mejor spread neto a lo largo del tiempo.
   Decisión de codificación (comprobada, no estimada): el verde y el rojo del sistema
   quedan a ΔE 2,1 en deuteranopía, así que pintar "gana/pierde" solo con color habría
   dejado fuera a los daltónicos. Quien manda aquí es la POSICIÓN respecto al eje cero,
   y los puntos que superan el umbral llevan además marcador relleno. El color es refuerzo.
   Una sola serie ⇒ sin leyenda: el título ya la nombra. */
function renderSpreadChart(){
  const samples = (STATE.spreadHistory||[]).filter(s=>s && isFiniteNum(s.best)).slice(0,40).reverse();
  if(samples.length < 2){
    return '<div class="empty-state" id="chartEmpty">'+emptyIcon()+'<p>'+esc(TEXTS.AUTO_CHART_EMPTY)+'</p></div>';
  }
  const W=640, H=180, PL=48, PR=14, PT=16, PB=28;
  const vals = samples.map(s=>s.best);
  const thr  = autoCfg().minNet;
  let min = Math.min(0, Math.min.apply(null, vals));
  let max = Math.max(thr, Math.max.apply(null, vals));
  const pad = ((max-min)*0.15) || 0.1;
  min -= pad; max += pad;
  const X = i => PL + (i/(samples.length-1))*(W-PL-PR);
  const Y = v => PT + (1-((v-min)/(max-min)))*(H-PT-PB);
  const line = samples.map((s,i)=>X(i).toFixed(1)+","+Y(s.best).toFixed(1)).join(" ");

  // Rejilla recesiva. Las escalas NO van dentro del SVG: el viewBox se escala con el
  // ancho disponible y a 320px el texto quedaba en 4,3px reales, ilegible en una app
  // que es mobile-first. Van fuera, en HTML, que no se escala.
  let grid = "";
  [max, (max+min)/2, min].forEach(function(v){
    const yy = Y(v).toFixed(1);
    grid += '<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#232b38" stroke-width="1"/>';
  });
  const escala = '<p class="chart-scale mono">'
    + '<span>'+esc(TEXTS.CHART_MAX)+" "+esc(fmtPct(max))+'</span>'
    + '<span>'+esc(TEXTS.CHART_THRESHOLD)+" "+esc(fmtPct(thr))+'</span>'
    + '<span>'+esc(TEXTS.CHART_MIN)+" "+esc(fmtPct(min))+'</span>'
    + '</p>';
  // Eje cero: la referencia que de verdad importa (por debajo, la comisión se come el spread).
  const zeroY = Y(0).toFixed(1);
  const zeroLine = (0>=min && 0<=max)
    ? '<line x1="'+PL+'" y1="'+zeroY+'" x2="'+(W-PR)+'" y2="'+zeroY+'" stroke="#808d9e" stroke-width="1.5" stroke-dasharray="4 3"/>'
    : "";
  // Umbral del piloto.
  const thrY = Y(thr).toFixed(1);
  const thrLine = (thr>=min && thr<=max)
    ? '<line x1="'+PL+'" y1="'+thrY+'" x2="'+(W-PR)+'" y2="'+thrY+'" stroke="#2fbf71" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>'
    : "";
  // Marcadores: relleno (≥8px) solo donde se supera el umbral — forma, no solo color.
  const marks = samples.map(function(s,i){
    if(s.best < thr) return "";
    const label = fmtPct(s.best)+" · "+TEXTS.AUTO_CHART_OPP;
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(s.best).toFixed(1)+'" r="4.5" fill="#2fbf71" stroke="#161d27" stroke-width="2">'
         + '<title>'+esc(label)+'</title></circle>';
  }).join("");

  // Alternativa en tabla: obligatoria para lectores de pantalla y para imprimir en blanco y negro.
  const tableRows = samples.map(function(s,i){
    return '<tr><td>'+esc(String(i+1))+'</td><td class="num mono">'+esc(fmtPct(s.best))+'</td></tr>';
  }).join("");

  return '<figure style="margin:0">'
    +escala
    +'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" '
      +'aria-labelledby="chartCaption" style="display:block;overflow:visible">'
      +grid+zeroLine+thrLine
      +'<polyline points="'+line+'" fill="none" stroke="#f0c75e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      +marks
    +'</svg>'
    +'<figcaption class="hint" id="chartCaption" style="margin-top:8px">'+esc(TEXTS.AUTO_CHART_CAPTION)+'</figcaption>'
    +'<table class="sr-only"><caption>'+esc(TEXTS.AUTO_CHART_TABLE)+'</caption>'
      +'<thead><tr><th scope="col">'+esc(TEXTS.TH_SAMPLE)+'</th><th scope="col">'+esc(TEXTS.TH_SPREAD)+'</th></tr></thead>'
      +'<tbody>'+tableRows+'</tbody></table>'
  +'</figure>';
}

const VIEW_TITLES = {
  "/":TEXTS.HOME_H1, "/arbitraje":TEXTS.ARBITRAJE_H1, "/simulador":TEXTS.SIMULADOR_H1,
  "/historial":TEXTS.HISTORIAL_H1, "/guia":TEXTS.GUIA_H1, "/acceso":TEXTS.ACCESO_H1,
  "/legal":TEXTS.LEGAL_H1, "/admin":TEXTS.ADMIN_H1, "/auto":TEXTS.AUTO_H1
};
const VIEWS = {
  "/": renderHome, "/arbitraje": renderArbitraje, "/simulador": renderSimulador,
  "/historial": renderHistorial, "/guia": renderGuia, "/acceso": renderAcceso,
  "/legal": renderLegal, "/admin": renderAdmin, "/auto": renderAuto
};
function currentPath(){
  let h = location.hash || "#/";
  h = h.replace(/^#/, "");
  h = h.split("?")[0];
  if(!h) h = "/";
  return h;
}
function updateNavCurrent(path){
  const map = {"/":"nav-home","/arbitraje":"nav-arbitraje","/simulador":"nav-simulador","/historial":"nav-historial","/auto":"nav-auto"};
  ["nav-home","nav-arbitraje","nav-simulador","nav-historial","nav-auto"].forEach(id=>{
    document.getElementById(id).removeAttribute("aria-current");
  });
  const activeId = map[path];
  if(activeId) document.getElementById(activeId).setAttribute("aria-current","page");
}
// ¿ha interactuado ya la persona con la página? Solo entonces movemos el foco al contenido al
// cambiar de pantalla. Durante el arranque (que dispara route() dos veces: carga + hashchange
// inicial) NO se toca el foco, para que el primer tabulador llegue a "Saltar al contenido".
let USER_INTERACTED = false;
["pointerdown","keydown","touchstart"].forEach(function(ev){
  window.addEventListener(ev, function(){ USER_INTERACTED = true; }, { passive:true });
});
function route(){
  // El enlace "Saltar al contenido" usa href="#view" (ancla real, no una ruta de la
  // app: las rutas siempre empiezan por "/"). Si el hash no es una ruta, no repintamos
  // la vista actual: solo movemos el foco al contenido principal.
  const rawHash = location.hash.replace(/^#/, "");
  if(rawHash && rawHash.charAt(0) !== "/"){
    const el = document.getElementById(rawHash) || document.getElementById("view");
    if(el) el.focus({preventScroll:false});
    return;
  }
  const path = currentPath();
  const renderFn = VIEWS[path] || renderHome;
  const view = document.getElementById("view");
  view.innerHTML = renderFn();
  document.title = (VIEW_TITLES[path] || TEXTS.META_TITLE) + " · " + CONFIG.BUSINESS_NAME;
  updateNavCurrent(VIEWS[path] ? path : "/");

  // contenido" y la barra superior.
  if(USER_INTERACTED) view.focus({preventScroll:true});

  afterRouteHooks(path);
}

/* =========================================================
   10) RELOJ DE PRECIOS (1 tick/seg, avanza ciclo cada REFRESH_MS)
   ========================================================= */
let countdown = CONFIG.REFRESH_MS/1000;
function paintCountdown(){
  document.getElementById("refreshCountdown").textContent = TEXTS.REFRESH_PREFIX + Math.max(0,Math.ceil(countdown)) + TEXTS.REFRESH_SUFFIX;
}
function advanceCycle(){
  STATE.tick++;
  pushHistory();
  refreshCurrentViewData();
  const liveStatus = document.getElementById("liveStatus");
  liveStatus.textContent = TEXTS.TOAST_PRICES_UPDATED + " · ciclo " + STATE.tick;
}
let clockInterval = null;
let sampleCounter = 0;
let CHART_DIRTY = true;   // hay muestra nueva sin dibujar
function startClock(){
  if(clockInterval) return;
  clockInterval = setInterval(function(){
    if(document.hidden) return;
    countdown -= 1;
    if(countdown <= 0){
      advanceCycle();
      countdown = CONFIG.REFRESH_MS/1000;
    }
    paintCountdown();
    // Con streaming vivo los precios cambian entre ciclos: repintamos en cuanto llegan ticks.
    if(LIVE_DIRTY){
      LIVE_DIRTY = false;
      updateDataModeBadge(true);
      refreshCurrentViewData();
    }
    // Muestreamos la serie de spreads cada 3 s: 40 muestras ≈ 2 minutos de gráfico.
    sampleCounter++;
    if(sampleCounter % 3 === 0){ pushSpreadHistory(currentRoutes()); CHART_DIRTY = true; }
    autoTick();
  }, 1000);
}

function handleClick(e){
  const t = e.target;
  const byId = id => t.closest && t.closest("#"+id);

  // Nav / hash links: dejar comportamiento nativo (href="#/...") — solo cerramos modales si estaban abiertos.
  if(byId("btnInstall")){
    buildInstallModal();
    openModal("installModal", document.getElementById("btnInstall"));
    if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); }
    return;
  }
  if(byId("installClose") || byId("installModalCloseX")){ closeModal("installModal"); return; }
  if(byId("arbModalCloseX") || byId("btnArbCancel")){ closeModal("arbModal"); return; }
  if(byId("btnArbConfirm")){ confirmArb(); return; }

  const arbOp = t.closest && t.closest('[id^="arb-op-"]');
  if(arbOp){
    const idx = Number(arbOp.id.replace("arb-op-",""));
    buildArbModal(idx);
    openModal("arbModal", arbOp);
    return;
  }

  if(byId("btnAutoToggle")){
    const turningOn = !autoCfg().on;
    setAutoOn(turningOn, null);
    toast(turningOn ? TEXTS.AUTO_STATUS_ON : TEXTS.AUTO_STATUS_OFF);
    routeAndRefocus("btnAutoToggle");
    return;
  }
  if(byId("btnRefresh")){
    advanceCycle();
    countdown = CONFIG.REFRESH_MS/1000;
    toast(TEXTS.TOAST_PRICES_UPDATED);
    return;
  }

  const posClose = t.closest && t.closest('[id^="pos-close-"]');
  if(posClose){
    const idx = Number(posClose.id.replace("pos-close-",""));
    closePosition(idx);
    return;
  }

  if(byId("btnReset")){ document.getElementById("resetConfirm").hidden = false; return; }
  if(byId("btnResetNo")){ document.getElementById("resetConfirm").hidden = true; return; }
  if(byId("btnResetYes")){
    STATE.wallet = { cash:CONFIG.INITIAL_CASH, locked:0, realized:0, initial:CONFIG.INITIAL_CASH, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    STATE.positions = [];
    STATE.trades = [];
    // El piloto se apaga y su bitácora se limpia con lo demás: si no, quedan anotadas
    // operaciones que ya no existen y el contador diario vuelve a cero, lo que convertía
    // "Reiniciar" en un atajo para saltarse el tope de operaciones.
    STATE.autoLog = [];
    STATE.autoLastAt = {};
    STATE.autoLastGlobalAt = 0;
    saveAutoCfg({ on:false });
    persist();
    document.getElementById("resetConfirm").hidden = true;
    toast(TEXTS.TOAST_RESET_DONE);
    route();
    return;
  }

  if(byId("btnExportMyOps")){ exportTradesCsv(); return; }
  if(byId("btnExportOps")){ exportTradesCsv(); return; }
  if(byId("btnExportLeads")){ exportLeadsCsv(); return; }

  const faqBtn = t.closest && t.closest('.accordion-trigger');
  if(faqBtn){
    const panel = document.getElementById(faqBtn.getAttribute("aria-controls"));
    const open = faqBtn.getAttribute("aria-expanded")==="true";
    faqBtn.setAttribute("aria-expanded", open?"false":"true");
    panel.classList.toggle("open", !open);
    return;
  }

  if(byId("btnLive")){
    STATE.settings.liveData = !STATE.settings.liveData;
    STATE.settings.updatedAt = new Date().toISOString();
    persist();
    const btn = document.getElementById("btnLive");
    btn.setAttribute("aria-pressed", STATE.settings.liveData?"true":"false");
    btn.textContent = TEXTS.BTN_LIVE_LABEL+": "+(STATE.settings.liveData?"ON":"OFF");
    const nota = document.getElementById("liveNote");
    nota.hidden = false;
    nota.textContent = STATE.settings.liveData ? TEXTS.LIVE_NOTE_ON : TEXTS.LIVE_NOTE;
    if(STATE.settings.liveData){
      fetchLivePrices().then(function(ok){
        updateDataModeBadge(ok);
        if(ok) refreshCurrentViewData();
      });
      openStreams();
    } else {
      closeStreams();
      LIVE_BASE_GOLD_USD = null;
      updateDataModeBadge(false);
    }
    return;
  }
  if(byId("btnWipe")){ document.getElementById("wipeConfirm").hidden = false; return; }
  if(byId("btnWipeNo")){ document.getElementById("wipeConfirm").hidden = true; return; }
  if(byId("btnWipeYes")){
    wipeAllData();
    paintCurrencySelect();
    toast(TEXTS.TOAST_DATA_WIPED);
    adminActiveTab = "ops";
    route();
    return;
  }
  if(byId("btnAdminLogout")){
    ADMIN_OK = false;
    adminActiveTab = "resumen";
    route();
    return;
  }
  const tabBtn = t.closest && t.closest('.tab[role="tab"]');
  if(tabBtn && tabBtn.id.indexOf("tab-")===0){
    adminActiveTab = tabBtn.id.replace("tab-","");
    route();
    return;
  }
}

/* Repinta la vista y devuelve el foco al control que originó la acción.
   Sin esto, quien navega con teclado pierde el sitio en cada cambio de moneda o
   guardado: route() manda el foco a <main> y el usuario acaba en otra parte. */
function routeAndRefocus(id){
  route();
  const el = document.getElementById(id);
  if(el && typeof el.focus === "function") el.focus();
}
function closePosition(idx){
  const p = STATE.positions[idx];
  if(!p) return;
  const prices = currentPricesById();
  const P = prices[p.market];
  const feeClose = r2(p.qty*P*CONFIG.FEE_PCT/100);
  let devuelto, pnl;
  if(p.side==="long"){
    devuelto = r2(p.qty*P);
  } else {
    devuelto = Math.max(0, r2(p.notional + (p.entryPrice-P)*p.qty));
  }
  // La comisión de cierre no puede empujar la caja por debajo de cero: en un corto cuyo
  // precio se dispare, "devuelto" ya llega recortado a 0 y la comisión sí la restaría.
  STATE.wallet.cash = r2(Math.max(0, STATE.wallet.cash + devuelto - feeClose));
  STATE.wallet.locked = r2(STATE.wallet.locked - p.notional);
  pnl = r2(devuelto - p.notional - p.feeOpen - feeClose);
  STATE.wallet.realized = r2(STATE.wallet.realized + pnl);
  STATE.wallet.updatedAt = new Date().toISOString();
  STATE.trades.unshift({
    id:uid("t"), ts:new Date().toISOString(), type:"close",
    market:p.market, label:p.label, side:p.side, price:P, entryPrice:p.entryPrice, positionId:p.id,
    qty:p.qty, fee:feeClose, pnl:pnl, cashAfter:STATE.wallet.cash
  });
  STATE.positions.splice(idx,1);
  if(STATE.trades.length>500) STATE.trades = STATE.trades.slice(0,500);
  persist();
  toast(TEXTS.TOAST_POSITION_CLOSED);
  refreshCurrentViewData();
}

function handleSubmit(e){
  const form = e.target;
  if(form.id === "tradeForm"){
    e.preventDefault();
    const marketSel = document.getElementById("trade-market");
    const sideSel = document.getElementById("trade-side");
    const qtyInput = document.getElementById("trade-qty");
    const errEl = document.getElementById("tradeError");
    errEl.textContent = "";
    const qty = parseFloat((qtyInput.value||"").replace(",","."));
    if(!qty || isNaN(qty) || qty<=0){ errEl.textContent = TEXTS.ERR_QTY_POSITIVE; return; }
    if(qty > CONFIG.MAX_QTY){ errEl.textContent = TEXTS.ERR_QTY_MAX; return; }
    const marketId = marketSel.value;
    const side = sideSel.value;
    const prices = currentPricesById();
    const price = prices[marketId];
    const notional = r2(qty*price);
    const feeOpen = r2(notional*CONFIG.FEE_PCT/100);
    if(STATE.wallet.cash < notional+feeOpen){ errEl.textContent = TEXTS.ERR_INSUFFICIENT_FUNDS; return; }
    const marketCfg = MARKETS.find(m=>m.id===marketId);
    STATE.wallet.cash = r2(STATE.wallet.cash - (notional+feeOpen));
    STATE.wallet.locked = r2(STATE.wallet.locked + notional);
    STATE.wallet.updatedAt = new Date().toISOString();
    const position = { id:uid("p"), market:marketId, label:MARKET_LABEL(marketCfg), side:side, qty:qty, entryPrice:price, notional:notional, feeOpen:feeOpen, openedAt:new Date().toISOString() };
    STATE.positions.push(position);
    STATE.trades.unshift({
      id:uid("t"), ts:new Date().toISOString(), type:"open",
      market:marketId, label:MARKET_LABEL(marketCfg), side:side, price:price, entryPrice:null, positionId:position.id,
      qty:qty, fee:feeOpen, pnl:0, cashAfter:STATE.wallet.cash
    });
    if(STATE.trades.length>500) STATE.trades = STATE.trades.slice(0,500);
    persist();
    toast(TEXTS.TOAST_TRADE_EXECUTED);
    refreshCurrentViewData();
    const firstClose = document.querySelector('[id^="pos-close-"]');
    if(firstClose) firstClose.focus();
    return;
  }
  if(form.id === "autoCfgForm"){
    e.preventDefault();
    const errEl = document.getElementById("autoCfgError");
    errEl.textContent = "";
    const num = id => parseFloat((document.getElementById(id).value||"").replace(",","."));
    const minNet = num("auto-minnet"), maxOpen = num("auto-maxopen");
    // Los importes se escriben en la moneda de lectura y se guardan en dólares, que es
    // como calcula el motor. Sin esta vuelta, en COP se configuraba un ticket 4.100× mayor.
    const ticket = num("auto-ticket") / fxRate();
    const dailyStop = num("auto-dailystop") / fxRate();
    const all = [minNet, ticket, maxOpen, dailyStop];
    if(all.some(v=>!isFinite(v) || v<=0)){ errEl.textContent = TEXTS.ERR_AUTO_RANGE; return; }
    const ajustado = {
      minNet:    clamp(minNet, 0.01, 10),
      ticket:    clamp(ticket, 10, 1000000),
      maxOpen:   Math.round(clamp(maxOpen, 1, 50)),
      dailyStop: clamp(dailyStop, 10, 1000000)
    };
    saveAutoCfg(ajustado);
    // D16: si se recortó algún valor, decirlo en vez de cambiarlo por la cara.
    const recortado = ajustado.minNet!==minNet || ajustado.maxOpen!==Math.round(maxOpen)
                   || Math.abs(ajustado.ticket-ticket)>0.01 || Math.abs(ajustado.dailyStop-dailyStop)>0.01;
    toast(recortado ? TEXTS.TOAST_AUTO_SAVED_CLAMPED : TEXTS.TOAST_AUTO_SAVED);
    routeAndRefocus("btnAutoSave");
    return;
  }
  if(form.id === "accesoForm"){
    e.preventDefault();
    const nombre = (document.getElementById("acceso-nombre").value||"").trim();
    const email = (document.getElementById("acceso-email").value||"").trim();
    const perfilSel = document.getElementById("acceso-perfil");
    const mensaje = (document.getElementById("acceso-mensaje").value||"").trim();
    const consent = document.getElementById("acceso-consent").checked;
    const errEl = document.getElementById("accesoError");
    errEl.textContent = "";
    if(nombre.length < 2){ errEl.textContent = TEXTS.ERR_NAME_REQUIRED; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ errEl.textContent = TEXTS.ERR_EMAIL_INVALID; return; }
    if(!consent){ errEl.textContent = TEXTS.ERR_CONSENT_REQUIRED; return; }
    STATE.leads.unshift({ id:uid("l"), ts:new Date().toISOString(), nombre:nombre, email:email, perfil:perfilSel.value, mensaje:mensaje, consent:true });
    persist();
    const wrap = document.getElementById("accesoFormWrap");
    wrap.innerHTML = '<div class="success-msg" id="accesoOk"><h2 style="margin-top:0">'+esc(TEXTS.ACCESO_OK_TITLE)+'</h2>'
      +'<p>'+esc(TEXTS.ACCESO_OK_BODY_PREFIX)+esc(nombre)+esc(TEXTS.ACCESO_OK_BODY_SUFFIX)+'</p>'
      +'<a id="accesoOkCta" class="btn btn-primary" href="#/arbitraje">'+esc(TEXTS.ACCESO_OK_CTA)+'</a></div>';
    return;
  }
  if(form.id === "adminLoginForm"){
    e.preventDefault();
    const passInput = document.getElementById("adm-pass");
    const errEl = document.getElementById("admError");
    errEl.textContent = "";
    const val = passInput.value||"";
    if(!val){ errEl.textContent = TEXTS.ERR_PASS_REQUIRED; return; }
    if(val !== STATE.adminPass){ errEl.textContent = TEXTS.ERR_PASS_WRONG; return; }
    ADMIN_OK = true;
    adminActiveTab = "resumen";
    route();
    return;
  }
  if(form.id === "adminPassForm"){
    e.preventDefault();
    const cur = document.getElementById("adm-cur").value||"";
    const n1 = document.getElementById("adm-new").value||"";
    const n2 = document.getElementById("adm-new2").value||"";
    const errEl = document.getElementById("adminPassError");
    errEl.textContent = "";
    if(!cur || !n1 || !n2){ errEl.textContent = TEXTS.ERR_FILL_THREE; return; }
    if(cur !== STATE.adminPass){ errEl.textContent = TEXTS.ERR_CUR_WRONG; return; }
    if(n1.length < 8){ errEl.textContent = TEXTS.ERR_NEW_SHORT; return; }
    if(n1 !== n2){ errEl.textContent = TEXTS.ERR_NEW_MISMATCH; return; }
    STATE.adminPass = n1;
    persist();
    toast(TEXTS.TOAST_PASS_UPDATED);
    return;
  }
}

/* =========================================================
   12) CSV (PLAN.md §6.5)
   ========================================================= */
function csvField(v){
  let s = String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'"+s;
  if(/[;"\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCsv(filenamePrefix, header, rows){
  if(!rows.length){ toast(TEXTS.TOAST_CSV_EMPTY); return; }
  const BOM = String.fromCharCode(0xFEFF);
  const lines = [header.join(";")].concat(rows.map(r=>r.map(csvField).join(";")));
  const csv = BOM + lines.join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = filenamePrefix+"-"+today+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(TEXTS.TOAST_CSV_GENERATED+" ("+rows.length+" filas)");
}
function exportTradesCsv(){
  const header = ["fecha","tipo","ruta_o_mercado","lado","cantidad","precio_compra","precio_venta","comision","pnl","saldo_despues"];
  const rows = STATE.trades.map(t=>{
    if(t.type==="arb"){
      return [fmtDate(t.ts), TEXTS.TYPE_ARB, t.buyMarket+"->"+t.sellMarket, "", t.qty, t.buyPrice, t.sellPrice, t.fee, t.pnl, t.cashAfter];
    }
    return [fmtDate(t.ts), t.type==="open"?TEXTS.TYPE_OPEN:TEXTS.TYPE_CLOSE, t.market, t.side==="long"?TEXTS.LABEL_LONG:TEXTS.LABEL_SHORT, t.qty, t.price, "", t.fee, t.pnl, t.cashAfter];
  });
  downloadCsv("operaciones", header, rows);
}
function exportLeadsCsv(){
  const header = ["fecha","nombre","email","perfil","mensaje","consentimiento"];
  const rows = STATE.leads.map(l=>[fmtDate(l.ts), l.nombre, l.email, profileLabel(l.perfil), l.mensaje||"", "Sí"]);
  downloadCsv("solicitudes", header, rows);
}
