<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marca de Agua IA · Detecta, gestiona y sustituye marcas de agua</title>
<meta name="description" content="Plataforma para detectar, limpiar, reconstruir y sustituir marcas de agua de contenido generado por IA — sobre contenido propio o autorizado. Procesamiento privado en tu navegador.">
<meta name="theme-color" content="#0a0d14">
<meta name="color-scheme" content="dark light">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d8bff'/%3E%3Cpath d='M32 12c7 9 12 15 12 22a12 12 0 1 1-24 0c0-7 5-13 12-22z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ===================== SISTEMA VISUAL (oscuro premium por defecto) ===================== */
:root{
  --bg:#0a0d14; --bg2:#0e131d; --surface:#111827; --surface2:#151d2e; --glass:rgba(20,27,44,.72);
  --line:#222c42; --line-soft:#1a2234;
  --ink:#eaf0fb; --ink-soft:#aab6cc; --ink-mut:#6d7a93;
  --brand:#6d8bff; --brand2:#8a5cff; --accent:#38e1c8;
  --grad:linear-gradient(135deg,#6d8bff 0%,#8a5cff 100%);
  --grad-soft:linear-gradient(135deg,rgba(109,139,255,.16),rgba(138,92,255,.16));
  --ok:#2fbf71; --warn:#f5b544; --err:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --radius:16px; --radius-sm:11px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#eef1f8; --surface:#ffffff; --surface2:#f7f9fd; --glass:rgba(255,255,255,.82);
  --line:#e2e7f1; --line-soft:#edf1f8;
  --ink:#141a26; --ink-soft:#48546b; --ink-mut:#7b869c;
  --grad-soft:linear-gradient(135deg,rgba(109,139,255,.12),rgba(138,92,255,.12));
  --shadow:0 1px 2px rgba(20,26,38,.06),0 20px 50px rgba(20,26,38,.10);
  --shadow-sm:0 1px 2px rgba(20,26,38,.05),0 8px 22px rgba(20,26,38,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 600px at 82% -8%,rgba(138,92,255,.16),transparent 60%),radial-gradient(900px 560px at -6% 6%,rgba(109,139,255,.14),transparent 55%)}
img{max-width:100%;display:block}
svg{width:16px;height:16px;flex-shrink:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.02em;font-weight:700}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-mut)}
.soft{color:var(--ink-soft)}
.hidden{display:none!important}

/* ===== Layout: barra superior + contenido ===== */
.appbar{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:11px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;flex-shrink:0}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(109,139,255,.4)}
.brand .mk svg{width:18px;height:18px}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-mut);letter-spacing:.02em}
nav.pills{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;-ms-overflow-style:none;padding:2px}
nav.pills::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;border:1px solid transparent;transition:.15s;cursor:pointer;background:none}
.pill:hover{color:var(--ink);background:var(--surface2)}
.pill.active{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(109,139,255,.35)}
.pill svg{width:15px;height:15px}
.appbar .right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.credits-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.credits-chip b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:.15s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn svg{width:18px;height:18px}

main{max-width:1180px;margin:0 auto;padding:24px 18px 90px}
.page-head{margin:6px 0 20px}
.page-head h1{font-size:clamp(23px,4.6vw,32px)}
.page-head p{color:var(--ink-soft);margin-top:6px;max-width:640px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.15em;font-weight:700;color:var(--brand)}

/* ===== Botones ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border:1px solid transparent;border-radius:11px;padding:11px 18px;cursor:pointer;transition:transform .12s,background .2s,border-color .2s,opacity .2s;line-height:1}
.btn:active{transform:scale(.975)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(109,139,255,.32)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-soft{background:var(--grad-soft);color:var(--ink);border-color:var(--line)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}

/* ===== Tarjetas / grid ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.card.glass{background:var(--glass);backdrop-filter:blur(10px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:12px;color:var(--ink-mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:flex;align-items:center;gap:7px}
.stat .k svg{width:15px;height:15px;color:var(--brand)}
.stat .v{font-size:27px;font-weight:800;margin-top:8px}
.stat .v.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:rgba(47,191,113,.35);background:rgba(47,191,113,.1)}
.chip.warn{color:var(--warn);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.1)}
.chip.info{color:var(--brand);border-color:rgba(109,139,255,.35);background:rgba(109,139,255,.1)}
.badge-sim{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--warn);border:1px solid rgba(245,181,68,.4);background:rgba(245,181,68,.1);padding:2px 7px;border-radius:6px;text-transform:uppercase}

/* ===== Hero (dashboard) ===== */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px;background:linear-gradient(135deg,rgba(109,139,255,.16),rgba(138,92,255,.14));border:1px solid var(--line);margin-bottom:22px}
.hero h1{font-size:clamp(24px,4.4vw,34px);max-width:640px}
.hero p{color:var(--ink-soft);margin:10px 0 18px;max-width:560px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}

/* ===== Editor ===== */
.editor{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.filebar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
.filebar b{color:var(--ink)}
.stage-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;transition:.2s;background:var(--surface2)}
.dropzone.drag{border-color:var(--brand);background:var(--grad-soft)}
.dropzone .dz-ic{width:54px;height:54px;border-radius:14px;background:var(--grad-soft);display:grid;place-items:center;margin:0 auto 12px}
.dropzone .dz-ic svg{width:26px;height:26px;color:var(--brand)}
.canvas-host{position:relative;border-radius:12px;overflow:hidden;background:
  conic-gradient(from 0deg,#0000 0 90deg,rgba(255,255,255,.03) 0 180deg,#0000 0 270deg,rgba(255,255,255,.03) 0) 0 0/22px 22px;
  line-height:0;touch-action:none}
.canvas-host canvas{width:100%;height:auto;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%}
.tools .card{margin-bottom:14px}
.tool-h{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;margin-bottom:4px}
.tool-h .n{width:24px;height:24px;border-radius:7px;background:var(--grad-soft);color:var(--brand);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.tool-sub{font-size:12.5px;color:var(--ink-mut);margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],.field input[type=password],.field input[type=email],.field select,.field textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,139,255,.22)}
.range-row{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--line);flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--brand);cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--grad-soft);border-color:var(--brand);color:var(--brand)}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px;margin:6px 0 12px}
.consent input{margin-top:3px;width:17px;height:17px;accent-color:var(--brand);flex-shrink:0}
.consent label{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.consent.err{border-color:var(--err);background:rgba(255,107,107,.08)}
.consent-msg{color:var(--err);font-size:12.5px;font-weight:600;margin:-4px 0 10px;display:none}
.consent-msg.show{display:block}

/* Detección */
.finding{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13px}
.finding:first-of-type{border-top:none}
.finding .fi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.finding .fi.p{background:rgba(138,92,255,.14);color:var(--brand2)}
.finding .fi.g{background:rgba(56,225,200,.14);color:var(--accent)}
.finding code{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);word-break:break-word;background:var(--surface2);padding:1px 5px;border-radius:5px}
.zone-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px}
.zone-item:first-child{border-top:none}
.empty{text-align:center;color:var(--ink-mut);padding:26px 16px}
.empty .ic{font-size:32px;margin-bottom:8px}

/* Comparador antes/después */
.cmp{position:relative;border-radius:12px;overflow:hidden;background:#000;user-select:none;touch-action:none}
.cmp-stage{position:relative;transform-origin:0 0}
.cmp canvas{width:100%;height:auto;display:block}
#cmpBase{position:relative}
#cmpAfter{position:absolute;top:0;left:0;clip-path:inset(0 0 0 50%)}
.cmp .tag{position:absolute;top:8px;font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;z-index:4}
.cmp .tag.a{left:8px}.cmp .tag.b{right:8px}
.cmp-handle{position:absolute;top:0;height:100%;width:38px;transform:translateX(-50%);display:grid;place-items:center;z-index:5;pointer-events:none}
.cmp-handle .grip{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.5);color:#fff;font-size:14px;font-weight:800}
.cmp-ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.cmp-ctrls input[type=range]{max-width:170px}
.info-line{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:10px}
.info-line b{color:var(--ink)}

/* Pricing */
.plan{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-sm);position:relative}
.plan.pop{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 20px 46px rgba(109,139,255,.22)}
.plan .pop-tag{position:absolute;top:-11px;left:22px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;letter-spacing:.03em}
.plan h3{font-size:19px}
.plan .price{font-size:32px;font-weight:800;margin:10px 0 2px}
.plan .price small{font-size:14px;font-weight:600;color:var(--ink-mut)}
.plan ul{list-style:none;margin:14px 0 18px;display:flex;flex-direction:column;gap:9px}
.plan li{font-size:13.5px;color:var(--ink-soft);display:flex;gap:9px;align-items:flex-start}
.plan li svg{width:16px;height:16px;color:var(--ok);flex-shrink:0;margin-top:2px}
.plan .btn{margin-top:auto}

/* Tablas */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-soft)}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mut);font-weight:700}
.tbl tr:hover td{background:var(--surface2)}
.tbl .thumb{width:46px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}

/* Legal / prosa */
.prose{max-width:760px}
.prose h2{font-size:20px;margin:26px 0 8px}
.prose h3{font-size:16px;margin:18px 0 6px}
.prose p,.prose li{color:var(--ink-soft);font-size:14px;margin-bottom:8px}
.prose ul{margin:0 0 10px 20px}
.callout{border-left:3px solid var(--brand);background:var(--grad-soft);border-radius:0 12px 12px 0;padding:14px 16px;margin:14px 0;font-size:13.5px;color:var(--ink-soft)}
.callout b{color:var(--ink)}

/* Admin */
.gate{max-width:400px;margin:8vh auto;text-align:center}
.gate .mk{width:52px;height:52px;border-radius:14px;background:var(--grad);display:grid;place-items:center;margin:0 auto 14px}
.gate .mk svg{width:26px;height:26px}
.log-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13px}
.log-row:first-child{border-top:none}
.log-row .lt{font-family:var(--mono);font-size:11px;color:var(--ink-mut);white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.kv:first-child{border-top:none}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(24px);background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:200;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(47,191,113,.5)}
.toast.err{border-color:rgba(255,107,107,.5)}

/* Footer */
footer.site{border-top:1px solid var(--line);margin-top:40px;padding:24px 18px;color:var(--ink-mut);font-size:12.5px}
footer.site .in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer.site a{color:var(--ink-soft)}
footer.site a:hover{color:var(--brand)}

/* Responsive */
@media(max-width:900px){.editor{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:620px){.g2,.g4{grid-template-columns:1fr}.brand small{display:none}.appbar-in{padding:10px 12px;gap:8px}main{padding:18px 12px 84px}.credits-chip .lbl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Tests de aceptación: los ejecuta tools/verificar-app.mjs clic a clic -->
<script type="application/json" id="acceptance-tests">
[
  { "name": "El dashboard carga y muestra créditos", "steps": [
    { "goto": "#/" }, { "expect": "Créditos" }
  ]},
  { "name": "Cargar ejemplo detecta procedencia en el código", "steps": [
    { "goto": "#/editor" }, { "clickText": "Usar imagen de ejemplo" }, { "wait": 400 },
    { "expect": "Procedencia" }, { "expect": "DemoDiffusion" }
  ]},
  { "name": "Muestra zonas visuales antes de tocar nada", "steps": [
    { "goto": "#/editor" }, { "clickText": "Usar imagen de ejemplo" }, { "wait": 400 },
    { "expect": "Zonas" }
  ]},
  { "name": "El consentimiento es obligatorio para procesar", "steps": [
    { "goto": "#/editor" }, { "clickText": "Usar imagen de ejemplo" }, { "wait": 400 },
    { "click": "#btn-process" }, { "expect": "Confirma" },
    { "check": "#rights-ack" }, { "click": "#btn-process" }, { "wait": 500 }, { "expect": "Después" }
  ]},
  { "name": "Limpiar metadatos deja el archivo sin marcas en el código", "steps": [
    { "goto": "#/editor" }, { "clickText": "Usar imagen de ejemplo" }, { "wait": 400 },
    { "click": "#btn-clean" }, { "wait": 300 }, { "expect": "limpi" }
  ]},
  { "name": "Añadir marca propia se aplica al resultado", "steps": [
    { "goto": "#/editor" }, { "clickText": "Usar imagen de ejemplo" }, { "wait": 400 },
    { "fill": { "sel": "#wm-text", "value": "© MI MARCA" } }, { "click": "#btn-wm" }, { "wait": 400 },
    { "expect": "Después" }
  ]},
  { "name": "El trabajo queda en el historial", "steps": [
    { "goto": "#/editor" }, { "clickText": "Usar imagen de ejemplo" }, { "wait": 400 },
    { "check": "#rights-ack" }, { "click": "#btn-process" }, { "wait": 500 },
    { "goto": "#/historial" }, { "expect": "ejemplo" }
  ]},
  { "name": "Comprar créditos es un pago simulado", "steps": [
    { "goto": "#/precios" }, { "clickText": "Añadir créditos" }, { "wait": 200 }, { "expect": "simulad" }
  ]},
  { "name": "El panel del dueño exige contraseña y muestra el registro", "steps": [

      {name:"esquina inferior izquierda",x:.02,y:.78,w:.38,h:.20},
      {name:"esquina superior derecha",x:.60,y:.02,w:.38,h:.20},
      {name:"esquina superior izquierda",x:.02,y:.02,w:.38,h:.20},
      {name:"banda central",x:.28,y:.40,w:.44,h:.20},

function inpaintRegion(ctx, w, h, box){

    const w=canvas.width,h=canvas.height; const sw=Math.min(w,240), sh=Math.max(1,Math.round(sw*h/w));
    const s=document.createElement("canvas"); s.width=sw; s.height=sh; s.getContext("2d").drawImage(canvas,0,0,sw,sh);
    const d=s.getContext("2d").getImageData(0,0,sw,sh).data;
    let ones=0,tot=0; const hist=new Array(256).fill(0);
    for(let i=0;i<d.length;i+=4){ for(let c=0;c<3;c++){ const v=d[i+c]; ones+=v&1; tot++; hist[v]++; } }
    const lsbRatio=tot?ones/tot:0.5;
    // chi-cuadrado de pares (2k, 2k+1): la esteganografía LSB tiende a igualar esas frecuencias
    let chi=0,pairs=0; for(let k=0;k<128;k++){ const a=hist[2*k],b=hist[2*k+1],e=(a+b)/2; if(e>4){ chi+=((a-e)*(a-e))/e; pairs++; } }
    const pairBalance=pairs?chi/pairs:99;
    let level="baja", note="No se aprecian indicios claros de marca invisible LSB.";
    if(Math.abs(lsbRatio-0.5)<0.02 && pairBalance<0.5){ level="media"; note="El plano de bits menos significativo está muy equilibrado: posible dato oculto (esteganografía LSB)."; }
    return { level, note, lsbRatio:+lsbRatio.toFixed(3) };
  }catch(e){ return { level:"baja", note:"No se pudo analizar la capa invisible.", lsbRatio:0 }; }
}
// Rompe marcas invisibles FRÁGILES: limpia el bit menos significativo con dither ligero (imperceptible)
function scrubInvisible(ctx,w,h){
  const img=ctx.getImageData(0,0,w,h); const d=img.data;
  for(let i=0;i<d.length;i+=4){ for(let c=0;c<3;c++){ let v=d[i+c]&0xFE; if(v<254 && (((i>>2)+c)&1)) v+=1; d[i+c]=v; } }
  ctx.putImageData(img,0,0);
}
function applyWatermark(ctx, w, h, opts){
  ctx.save();
  ctx.globalAlpha=clamp(opts.opacity,0,1);
  const size=Math.max(10, opts.sizePct/100 * Math.min(w,h));
  const draw=(cx,cy)=>{
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(opts.rotation*Math.PI/180);
    if(opts.mode==="logo" && opts.logo){ const lw=size, lh=size*(opts.logo.height/opts.logo.width||1); ctx.drawImage(opts.logo,-lw/2,-lh/2,lw,lh); }
    else { ctx.font="800 "+size+"px "+"-apple-system,Segoe UI,Roboto,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillStyle=opts.color||"#ffffff"; ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=size*0.06;
      ctx.fillText(opts.text||"© MARCA", 0, 0); }
    ctx.restore();
  };
  if(opts.tile){ const stepX=size*3.4, stepY=size*2.2; for(let y=stepY*0.3;y<h+stepY;y+=stepY){ for(let x=stepX*0.3;x<w+stepX;x+=stepX){ draw(x,y); } } }
  else { draw(opts.xPct/100*w, opts.yPct/100*h); }
  ctx.restore();
}

  g.fillStyle="#1d2b4a"; g.beginPath(); g.moveTo(0,720); g.lineTo(300,600); g.lineTo(560,700); g.lineTo(900,590); g.lineTo(1280,690); g.lineTo(1280,800); g.lineTo(0,800); g.closePath(); g.fill();

function resetEditorState(){ EDITOR.loaded=false; EDITOR.bytes=null; EDITOR.base=null; EDITOR.work=null; EDITOR.meta=null; EDITOR.invisible=null; EDITOR.detections=[]; EDITOR.selection=null; EDITOR.cleaned=false; EDITOR.exportBytes=0; EDITOR.cmp={pos:50,zoom:1,tx:0,ty:0}; }

function loadIntoEditor(canvas, bytes, name, mime){
  const MAX=1600; let w=canvas.width,h=canvas.height, scale=Math.min(1,MAX/Math.max(w,h));
  const bw=Math.round(w*scale), bh=Math.round(h*scale);
  const base=document.createElement("canvas"); base.width=bw; base.height=bh; base.getContext("2d").drawImage(canvas,0,0,bw,bh);
  const work=document.createElement("canvas"); work.width=bw; work.height=bh; work.getContext("2d").drawImage(base,0,0);
  EDITOR.loaded=true; EDITOR.name=name; EDITOR.mime=mime||"image/png"; EDITOR.bytes=bytes; EDITOR.w=bw; EDITOR.h=bh; EDITOR.base=base; EDITOR.work=work; EDITOR.cleaned=false; EDITOR.exportBytes=bytes?bytes.length:0;
  EDITOR.meta = bytes ? parseMetadata(bytes, EDITOR.mime) : {findings:[],hasProvenance:false};
  EDITOR.detections = detectVisual(base);
  EDITOR.invisible = analyzeInvisible(base);
  // caja por defecto = primera detección (o esquina inf. derecha)
  EDITOR.selection = EDITOR.detections[0] ? {x:EDITOR.detections[0].x,y:EDITOR.detections[0].y,w:EDITOR.detections[0].w,h:EDITOR.detections[0].h}
                                          : {x:Math.round(bw*.62),y:Math.round(bh*.80),w:Math.round(bw*.34),h:Math.round(bh*.16)};
  addLog("Análisis", "Archivo analizado: "+name+(EDITOR.meta.hasProvenance?" · procedencia IA detectada":""), false);
  renderEditor();
}

/* ---- Enlaces del editor ---- */
function bindEditorEmpty(){
  document.querySelectorAll(".js-sample").forEach(b=>b.addEventListener("click",onSample));
  const fi=byId("fileInput"); if(fi) fi.addEventListener("change",e=>{ if(e.target.files&&e.target.files[0]) onFile(e.target.files[0]); });
  const dz=byId("dropzone");
  if(dz){ ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag");}));
    ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("drag");}));
    dz.addEventListener("drop",e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) onFile(f); }); }
}
function bindEditorLoaded(){
  on("btn-newfile","click",()=>{ resetEditorState(); renderEditor(); });
  on("btn-sample","click",onSample);
  on("btn-clean","click",onCleanMetadata);
  on("btn-scrub","click",onScrubInvisible);
  on("btn-process","click",onProcess);
  on("btn-wm","click",onApplyWatermark);
  on("btn-usezone","click",()=>{ if(EDITOR.detections[0]){ const d=EDITOR.detections[0]; EDITOR.selection={x:d.x,y:d.y,w:d.w,h:d.h}; paintCanvas(); showToast("Zona seleccionada"); } else showToast("No hay zona detectada; dibuja una"); });
  on("btn-reset","click",()=>{ if(!EDITOR.base) return; EDITOR.work.getContext("2d").drawImage(EDITOR.base,0,0); paintCompare(); showToast("Cambios deshechos"); });
  on("btn-download","click",onDownload);
  on("btn-version","click",onSaveVersion);
  // zonas detectadas
  document.querySelectorAll("[data-zone]").forEach(b=>b.addEventListener("click",()=>{ const d=EDITOR.detections[+b.dataset.zone]; if(d){ EDITOR.selection={x:d.x,y:d.y,w:d.w,h:d.h}; paintCanvas(); showToast("Zona seleccionada"); } }));
  // marca propia
  document.querySelectorAll("[data-wmmode]").forEach(b=>b.addEventListener("click",()=>{ WM.mode=b.dataset.wmmode; renderEditor(); }));

  bindRange("wm-op",v=>{WM.opacity=+v/100; setText("wmOpV",v+"%");});
  bindRange("wm-rot",v=>{WM.rotation=+v; setText("wmRotV",v+"°");});
  const wt=byId("wm-text"); if(wt) wt.addEventListener("input",e=>WM.text=e.target.value);
  const tl=byId("wm-tile"); if(tl) tl.addEventListener("change",e=>WM.tile=e.target.checked);
  const wl=byId("wm-logo"); if(wl) wl.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const img=new Image(); img.onload=()=>{ WM.logo=img; setText("wmLogoName","logo cargado"); showToast("Logo cargado"); }; img.onerror=()=>showToast("No se pudo leer el logo","err"); img.src=URL.createObjectURL(f); });
  // comparador
  bindCompare();
}
function on(id,ev,fn){ const el=byId(id); if(el) el.addEventListener(ev,fn); }
function bindRange(id,fn){ const el=byId(id); if(el) el.addEventListener("input",e=>fn(e.target.value)); }
function setText(id,t){ const el=byId(id); if(el) el.textContent=t; }

/* ---- Carga de archivos ---- */
function onSample(){ try{ const s=makeSample(); loadIntoEditor(s.canvas, s.bytes, s.name, s.mime); showToast("Imagen de ejemplo cargada","ok"); }catch(e){ showToast("No se pudo generar el ejemplo","err"); } }
function onFile(file){
  if(!file || !/^image\//.test(file.type)){ showToast("Por ahora solo imágenes: PNG, JPG o WEBP","err"); return; }
  const reader=new FileReader();
  reader.onload=()=>{ const bytes=new Uint8Array(reader.result);
    const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext("2d").drawImage(img,0,0); loadIntoEditor(c,bytes,file.name,file.type); showToast("Imagen cargada","ok"); };
    img.onerror=()=>showToast("No se pudo abrir la imagen","err");
    img.src=URL.createObjectURL(new Blob([bytes],{type:file.type})); };
  reader.onerror=()=>showToast("No se pudo leer el archivo","err");
  reader.readAsArrayBuffer(file);
}

/* ---- Pintar canvas + overlay de zonas ---- */
function paintCanvas(){
  const E=EDITOR; const bc=byId("baseCanvas"), ov=byId("overlay"); if(!bc||!ov||!E.work) return;
  bc.width=E.w; bc.height=E.h; bc.getContext("2d").drawImage(E.work,0,0);
  ov.width=E.w; ov.height=E.h; const g=ov.getContext("2d"); g.clearRect(0,0,E.w,E.h);
  // detecciones
  E.detections.forEach(d=>{ g.strokeStyle="rgba(138,92,255,.9)"; g.lineWidth=Math.max(2,E.w/500); g.setLineDash([10,7]); g.strokeRect(d.x,d.y,d.w,d.h); });
  g.setLineDash([]);
  // selección activa
  if(E.selection){ const s=E.selection; g.strokeStyle="#38e1c8"; g.lineWidth=Math.max(2,E.w/380); g.strokeRect(s.x,s.y,s.w,s.h); g.fillStyle="rgba(56,225,200,.14)"; g.fillRect(s.x,s.y,s.w,s.h); }
  bindCanvasSelection();
}
function bindCanvasSelection(){
  const host=byId("host"); const ov=byId("overlay"); if(!host||!ov||host._bound) return; host._bound=true;
  let drag=null;
  const toImg=(e)=>{ const r=ov.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*EDITOR.w; const y=(e.clientY-r.top)/r.height*EDITOR.h; return {x:clamp(x,0,EDITOR.w),y:clamp(y,0,EDITOR.h)}; };
  ov.addEventListener("pointerdown",e=>{ e.preventDefault(); ov.setPointerCapture(e.pointerId); drag=toImg(e); EDITOR.selection={x:drag.x,y:drag.y,w:1,h:1}; });
  ov.addEventListener("pointermove",e=>{ if(!drag) return; const p=toImg(e); EDITOR.selection={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(p.x-drag.x),h:Math.abs(p.y-drag.y)}; paintOverlayOnly(); });
  ov.addEventListener("pointerup",()=>{ drag=null; });
  ov.addEventListener("pointercancel",()=>{ drag=null; });
}
function paintOverlayOnly(){ const E=EDITOR; const ov=byId("overlay"); if(!ov) return; const g=ov.getContext("2d"); g.clearRect(0,0,E.w,E.h);
  E.detections.forEach(d=>{ g.strokeStyle="rgba(138,92,255,.6)"; g.lineWidth=Math.max(2,E.w/500); g.setLineDash([10,7]); g.strokeRect(d.x,d.y,d.w,d.h); }); g.setLineDash([]);
  if(E.selection){ const s=E.selection; g.strokeStyle="#38e1c8"; g.lineWidth=Math.max(2,E.w/380); g.strokeRect(s.x,s.y,s.w,s.h); g.fillStyle="rgba(56,225,200,.14)"; g.fillRect(s.x,s.y,s.w,s.h); } }

/* ---- Procesar (eliminar/reconstruir) ---- */
function onProcess(){
  const E=EDITOR; if(!E.loaded){ showToast("Primero carga una imagen"); return; }
  const consent=byId("rights-ack"); const box=byId("consentBox"); const msg=byId("consentMsg");
  if(!consent||!consent.checked){ if(box) box.classList.add("err"); if(msg) msg.classList.add("show"); showToast("Confirma que tienes derechos sobre el contenido","err"); return; }
  if(box) box.classList.remove("err"); if(msg) msg.classList.remove("show");
  const sel=E.selection; if(!sel||sel.w<3||sel.h<3){ showToast("Marca primero una zona sobre la imagen"); return; }
  const method=(byId("method")||{}).value||"inpaint";
  const cost=CONFIG.COSTS[method]!=null?CONFIG.COSTS[method]:CONFIG.COSTS.inpaint;
  if(!chargeCredits(cost, "Proceso: "+method)){ showToast("No te quedan créditos suficientes","err"); navTo("precios"); return; }
  const ctx=E.work.getContext("2d");
  try{
    if(method==="clone") cloneRegion(ctx,E.w,E.h,sel);
    else if(method==="blur") blurRegion(ctx,E.w,E.h,sel);
    else inpaintRegion(ctx,E.w,E.h,sel);
  }catch(e){ showToast("Error al procesar","err"); return; }
  const label={inpaint:"Reconstrucción (inpaint)",clone:"Clonado",blur:"Difuminado"}[method]||method;
  recordJob(label, method);
  addLog("Proceso", label+" en zona ["+[sel.x,sel.y,sel.w,sel.h].map(n=>Math.round(n)).join(",")+"] de "+E.name, true);
  paintCanvas(); paintCompare();
  showToast("Zona procesada · "+label,"ok");
}

/* ---- Aplicar marca propia ---- */
function onApplyWatermark(){
  const E=EDITOR; if(!E.loaded){ showToast("Primero carga una imagen"); return; }
  if(WM.mode==="logo" && !WM.logo){ showToast("Sube primero un logo o cambia a modo Texto"); return; }
  if(!chargeCredits(CONFIG.COSTS.watermark,"Marca propia")){ showToast("No te quedan créditos","err"); navTo("precios"); return; }
  try{ applyWatermark(E.work.getContext("2d"), E.w, E.h, WM); }catch(e){ showToast("No se pudo aplicar la marca","err"); return; }
  recordJob(WM.tile?"Marca en mosaico":"Marca aplicada","watermark");
  addLog("Marca propia", (WM.mode==="logo"?"Logo":("Texto: "+WM.text))+(WM.tile?" (mosaico)":"")+" sobre "+E.name, true);
  paintCanvas(); paintCompare();
  showToast("Marca aplicada","ok");
}

/* ---- Limpiar metadatos ---- */
function onCleanMetadata(){
  const E=EDITOR; if(!E.loaded||!E.bytes){ showToast("Primero carga una imagen"); return; }
  if(!chargeCredits(CONFIG.COSTS.clean,"Limpieza de metadatos")){ showToast("No te quedan créditos","err"); navTo("precios"); return; }
  let clean;
  try{
    if(isPNG(E.bytes)) clean=pngStrip(E.bytes);
    else { // re-encode del canvas → sin metadatos
      const durl=E.work.toDataURL(E.mime==="image/jpeg"?"image/jpeg":"image/png",0.92); clean=dataURLtoBytes(durl);
    }
  }catch(e){ clean=E.bytes; }
  E.bytes=clean; E.exportBytes=clean.length; E.cleaned=true;
  E.meta=parseMetadata(clean, E.mime);
  const remaining=E.meta.findings.length;
  recordJob("Metadatos limpiados","clean");
  addLog("Limpieza", "Metadatos eliminados de "+E.name+" ("+remaining+" restantes)", true);
  renderEditor();
  showToast(remaining===0?"Marcas ocultas borradas · archivo limpio (0 metadatos)":"Metadatos limpiados ("+remaining+" restantes)","ok");
}

/* ---- Romper marca invisible (esteganografía LSB en píxeles) ---- */
function onScrubInvisible(){
  const E=EDITOR; if(!E.loaded){ showToast("Primero carga una imagen"); return; }
  if(!chargeCredits(CONFIG.COSTS.clean,"Romper marca invisible")){ showToast("No te quedan créditos","err"); navTo("precios"); return; }
  try{ scrubInvisible(E.work.getContext("2d"), E.w, E.h); }catch(e){ showToast("No se pudo procesar la capa invisible","err"); return; }
  E.invisible=analyzeInvisible(E.work);
  recordJob("Marca invisible rota","scrub");
  addLog("Marca invisible", "Re-muestreo de píxeles (LSB) en "+E.name, true);
  renderEditor();
  showToast("Capa invisible frágil eliminada (re-muestreo LSB)","ok");
}

/* ---- Exportar / versiones ---- */
function exportCurrentBlob(cb){
  const E=EDITOR; const fmt=(byId("expFormat")||{}).value||"image/png";
  try{ E.work.toBlob(b=>{ if(!b){ showToast("No se pudo exportar","err"); return; } cb(b,fmt); }, fmt, fmt==="image/png"?undefined:0.92); }
  catch(e){ showToast("Exportación no soportada aquí","err"); }
}
function onDownload(){
  const E=EDITOR; if(!E.loaded){ showToast("Primero carga una imagen"); return; }
  exportCurrentBlob((blob,fmt)=>{ E.exportBytes=blob.size; setText("sizeInfo",fmtBytes(blob.size)); setText("fmtInfo",fmt.replace("image/","").toUpperCase());
    const ext=fmt.replace("image/",""); const base=E.name.replace(/\.[^.]+$/,"")||"resultado";
    downloadBlob(blob, base+"-editado."+ext); addLog("Exportación","Descargado "+base+"-editado."+ext,false); showToast("Descargando resultado","ok"); });
}
function onSaveVersion(){ if(!EDITOR.loaded){ showToast("Primero carga una imagen"); return; } recordJob("Versión guardada","version"); showToast("Versión guardada en el historial","ok"); }

/* ---- Registrar trabajo en historial ---- */
function recordJob(methodLabel, method){
  const E=EDITOR;
  let thumb=""; try{ const t=document.createElement("canvas"); const s=Math.min(1,320/Math.max(E.w,E.h)); t.width=Math.round(E.w*s); t.height=Math.round(E.h*s); t.getContext("2d").drawImage(E.work,0,0,t.width,t.height); thumb=t.toDataURL("image/jpeg",0.72); }catch(e){}
  addJob({ id:uid(), name:E.name, method, methodLabel, w:E.w, h:E.h, provenance:!!(E.meta&&E.meta.hasProvenance), cleaned:E.cleaned, createdAt:Date.now(), thumbAfter:thumb, status:"done" });
  paintCredits();
}

/* ---- Comparador antes/después ---- */
function paintCompare(){
  const E=EDITOR; const b=byId("cmpBase"), a=byId("cmpAfter"); if(!b||!a||!E.base) return;
  b.width=E.w; b.height=E.h; b.getContext("2d").drawImage(E.base,0,0);
  a.width=E.w; a.height=E.h; a.getContext("2d").drawImage(E.work,0,0);
  applyCmpPos(); applyCmpZoom();
}
function applyCmpPos(){ const a=byId("cmpAfter"), h=byId("cmpHandle"); const pos=EDITOR.cmp.pos; if(a) a.style.clipPath="inset(0 0 0 "+pos+"%)"; if(h) h.style.left=pos+"%"; }
function applyCmpZoom(){ const st=byId("cmpStage"); if(!st) return; const z=EDITOR.cmp.zoom; st.style.transform="translate("+EDITOR.cmp.tx+"px,"+EDITOR.cmp.ty+"px) scale("+z+")"; }
function bindCompare(){
  const r=byId("cmpRange"); if(r) r.addEventListener("input",e=>{ EDITOR.cmp.pos=+e.target.value; applyCmpPos(); });
  on("zoomIn","click",()=>{ EDITOR.cmp.zoom=clamp(EDITOR.cmp.zoom*1.25,1,6); applyCmpZoom(); });
  on("zoomOut","click",()=>{ EDITOR.cmp.zoom=clamp(EDITOR.cmp.zoom/1.25,1,6); if(EDITOR.cmp.zoom===1){EDITOR.cmp.tx=0;EDITOR.cmp.ty=0;} applyCmpZoom(); });
  on("zoomReset","click",()=>{ EDITOR.cmp.zoom=1;EDITOR.cmp.tx=0;EDITOR.cmp.ty=0; applyCmpZoom(); });
  const cmp=byId("cmp"); if(cmp&&!cmp._bound){ cmp._bound=true;
    cmp.addEventListener("wheel",e=>{ e.preventDefault(); const d=e.deltaY<0?1.12:1/1.12; EDITOR.cmp.zoom=clamp(EDITOR.cmp.zoom*d,1,6); if(EDITOR.cmp.zoom===1){EDITOR.cmp.tx=0;EDITOR.cmp.ty=0;} applyCmpZoom(); },{passive:false});
    let pan=null; cmp.addEventListener("pointerdown",e=>{ if(EDITOR.cmp.zoom<=1) return; pan={x:e.clientX,y:e.clientY,tx:EDITOR.cmp.tx,ty:EDITOR.cmp.ty}; cmp.setPointerCapture(e.pointerId); });
    cmp.addEventListener("pointermove",e=>{ if(!pan) return; EDITOR.cmp.tx=pan.tx+(e.clientX-pan.x); EDITOR.cmp.ty=pan.ty+(e.clientY-pan.y); applyCmpZoom(); });
    cmp.addEventListener("pointerup",()=>{ pan=null; }); cmp.addEventListener("pointercancel",()=>{ pan=null; });
  }
}

function renderAdminGate(bad){
  view().innerHTML=`
  <div class="gate card">
    <div class="mk">${iconLock()}</div>
    <h1 style="font-size:22px">Acceso del dueño</h1>
    <p class="muted" style="margin:6px 0 16px">Zona privada de administración de ${esc(CONFIG.PRODUCT_NAME)}.</p>
    <div class="callout" style="text-align:left;margin-bottom:14px">🔎 <b>Demo:</b> la contraseña es <b>${esc(CONFIG.ADMIN_PASSWORD)}</b> (cámbiala en <code class="mono">CONFIG.ADMIN_PASSWORD</code>).</div>
    <form id="adminForm">
      <div class="field"><input type="password" id="adm-pass" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña"></div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      ${bad?`<p style="color:var(--err);font-size:13px;margin-top:10px">Contraseña incorrecta.</p>`:""}
    </form>
    <p style="margin-top:14px"><a href="#/" class="muted" style="font-size:13px">← Volver</a></p>
  </div>`;
  const f=byId("adminForm"); if(f) f.addEventListener("submit",e=>{ e.preventDefault();
    const now=Date.now(); let g={n:0,until:0}; try{ g=JSON.parse(sessionStorage.getItem("wm_gate")||"{}"); }catch(err){}
    if(g.until&&now<g.until){ showToast("Demasiados intentos. Espera "+Math.ceil((g.until-now)/1000)+"s","err"); return; }
    if((byId("adm-pass")||{}).value===CONFIG.ADMIN_PASSWORD){ try{ sessionStorage.setItem(K.admin,"1"); sessionStorage.removeItem("wm_gate"); }catch(err){} renderAdmin(); }
    else { g.n=(g.n||0)+1; if(g.n>=5){ g.until=now+60000; g.n=0; showToast("Demasiados intentos. Espera 60s","err"); } try{ sessionStorage.setItem("wm_gate",JSON.stringify(g)); }catch(err){} renderAdminGate(true); }
  });
}

/* ==================================================================================
   PWA (instalación)
   ================================================================================== */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; });
function promptInstall(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;}); } else { showToast("Para instalar, ábrela en HTTPS y usa 'Añadir a pantalla de inicio'"); } }
function setupPWA(){
  try{
    const manifest={ name:CONFIG.PRODUCT_NAME, short_name:"MarcaIA", start_url:".", display:"standalone", background_color:"#0a0d14", theme_color:"#0a0d14",
      icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%236d8bff'/%3E%3Cpath d='M256 96c56 72 96 120 96 176a96 96 0 1 1-192 0c0-56 40-104 96-176z' fill='%23fff'/%3E%3C/svg%3E", sizes:"512x512", type:"image/svg+xml", purpose:"any" }] };
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    const link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
  }catch(e){}
}
